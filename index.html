let D = null;
function startDiag(){
  D = {i:0, items:[], used:new Set(), theta:2, t0:Date.now(), cur:null, picked:null};
  nextItem(); go('diag');
}
function pickTemplate(group, theta){
  const s=S();
  const pool = s.diag.filter(t=>t.group===group && !D.used.has(t.id));
  const src = pool.length ? pool : s.diag.filter(t=>t.group===group);
  const any = src.length ? src : s.diag;
  let best=any[0], bd=99;
  for(const t of any){ const d=Math.abs(t.diff-theta); if(d<bd){bd=d;best=t;} }
  return best;
}
function nextItem(){
  const s=S();
  const g = s.blueprint[D.i % s.blueprint.length];
  const T = pickTemplate(g, D.theta);
  D.used.add(T.id);
  const q = sanitizeQ(T.gen(nextR()));
  D.cur = {T, q, seed:LAST_SEED, t:Date.now()};
  D.picked = null;
}
/* ═══ ЗАДАНИЯ ЧАСТИ 2 · ПОШАГОВЫЙ ФОРМАТ (решение D11) ═══
   Развёрнутое решение машина не проверяет (D7) — проверяются промежуточные шаги,
   у каждого из которых есть числовой или выборочный ответ. Итоговую запись ученик
   сверяет с эталоном сам: балл за оформление ставит эксперт, и мы этого не имитируем. */
function curStep(q){ return (q && q.type==='steps' && q.steps) ? q.steps[Math.min(G && G.sub ? G.sub.i : 0, q.steps.length-1)] : null; }
function stepsDone(q){ return G && G.sub ? G.sub.i >= q.steps.length : false; }
function stepBar(q){
  const i = G && G.sub ? G.sub.i : 0;
  return `<div class="steps-bar">${q.steps.map((st,k)=>
    `<span class="st ${k<i?'done':k===i?'now':''}" title="шаг ${k+1}">${k<i?'✓':k+1}</span>`).join('')}</div>`;
}

function answerBox(q, act, extra){
  if(q.type==='steps'){
    const st=curStep(q);
    if(!st) return '';
    return answerBox(Object.assign({}, st, {hint:st.hint}), act, extra);
  }
  if(q.type==='num'||q.type==='text'){
    return `<div class="answer">
      <input type="text" id="ans" placeholder="ответ" autocomplete="off" ${q.type==='num'?'inputmode="decimal"':''}>
      <button onclick="${act}">${extra?'Проверить':'Дальше'}</button>
      ${extra||`<button class="ghost" onclick="submitDiag(true)">Не знаю</button>`}</div>`;
  }
  const multi = q.type==='multi';
  return `<div class="opts">${q.opts.map((o,i)=>
      `<button class="opt" onclick="${multi?'toggleOpt':'pickOpt'}(${i})" id="o${i}">

function flash(msg){

/* Канонический список ответов, которые задание вообще предусматривает:
   верный, его синонимы и все разобранные неверные. Ребёнок почти всегда попадает
   в один из них, и тогда в код едет НОМЕР, а не набранная строка.
   Тот же порядок повторён в demo/report/render_tasks.js — они обязаны совпадать. */
function knownAnswers(q){
  return [String(q.ans)].concat((q.alt||[]).map(String), Object.keys(q.wrong||{}));
}
function knownIndex(q, raw){
  const n = norm(String(raw==null?'':raw));
  if(!n) return null;
  const i = knownAnswers(q).findIndex(a => norm(a) === n);
  return i >= 0 ? i : null;
}

function submitDiag(skip){
  const {T,q,t}=D.cur;
  let ok=false, code=null, given='—';
  if(!skip){
    const g = grade(q, (document.getElementById('ans')||{}).value, D.picked);
    if(!g) return flash(q.type==='num'||q.type==='text'
      ? 'Введите ответ или нажмите «Не знаю»'
      : 'Выберите вариант или нажмите «Не знаю»');
    ok=g.ok; code=g.code; given=g.given;
  }
  D.items.push({id:T.id, node:T.node, group:T.group, topic:T.topic, exam:T.exam,
    diff:T.diff, ok, code, given, right:rightText(q), stem:q.stem, seed:D.cur.seed,
    // вместо текста — номер: варианта для выбора, известного ответа для слова
    pick: skip ? null : (q.type==='text' ? knownIndex(q, given)
                       : q.type==='num'  ? null : D.picked),
    ms:Date.now()-t});
  D.theta = Math.max(1, Math.min(4, D.theta + (ok?0.6:-0.8)));
  D.i++;
  if(D.i>=CFG.diagLen){ finishDiag(); } else { nextItem(); render(); }
}
function finishDiag(){
  const s=S(), it=D.items, n=it.length;
  const acc = it.filter(x=>x.ok).length/n;
  const adv = it.filter(x=>x.diff>=3);
  const advAcc = adv.length? adv.filter(x=>x.ok).length/adv.length : 0;
  const easy = Math.round(s.maxPrimary*0.62), hard = s.maxPrimary-easy;
  const gate = Math.max(0, Math.min(1,(acc-0.6)/0.4));
  const primary = Math.max(0, Math.min(s.maxPrimary, Math.round(acc*easy + advAcc*hard*gate)));
  const half = Math.max(2, Math.round(s.maxPrimary/6 - n/8));
  const lo=Math.max(0,primary-half), hi=Math.min(s.maxPrimary,primary+half);

  let thr=true, gateOk=0, gateN=0;
  if(s.gate){
    const g = it.filter(x=>x.group===s.gate.group);
    gateN=g.length; gateOk=g.filter(x=>x.ok).length; thr = gateOk>=s.gate.need;
  }
  const mk = s.marks.find(m=>primary>=m.min);
  const mark = !thr ? `«2» — порог по ${s.gate.name} не взят` : (mk?mk.l:'«2» — ниже порога');

  const groups={};
  for(const x of it){ (groups[x.group]=groups[x.group]||{n:0,ok:0}); groups[x.group].n++; if(x.ok)groups[x.group].ok++; }
  ST.d[CUR] = {lo,hi,primary,mark,thr,gateOk,gateN,acc,groups,items:it,
               mins:Math.max(1,Math.round((Date.now()-D.t0)/60000))};

  const m = MAS();
  for(const nd of s.nodes){
    const rel = it.filter(x=>x.node===nd.id);
    if(rel.length) m[nd.id] = Math.max(m[nd.id]||0, rel.every(x=>x.ok)?0.55:0.22);
    else if(m[nd.id]===undefined) m[nd.id]=0.3;
  }
  save(ST); go('result');
}

let G=null;
function initTrain(){
  const s=S(), m=MAS();
  for(const n of s.nodes) if(m[n.id]===undefined) m[n.id]=0.3;
  G={cur:null, attempts:0, hints:0, done:0, lastNode:null, solved:0, picked:null, key:CUR, sub:null};
  nextTask(); save(ST);
}
function nextTask(){
  const s=S(), m=MAS();
  const cand = s.nodes.filter(n=>m[n.id]<0.92);
  const pool = (cand.length?cand:s.nodes).filter(n=>n.id!==G.lastNode);
  const list = pool.length?pool:(cand.length?cand:s.nodes);
  let node=list[0]; for(const n of list) if(m[n.id]<m[node.id]) node=n;
  const theta = 1+m[node.id]*3.2;
  const tpl = s.bank.filter(t=>t.node===node.id);
  const R=nextR();
  let best=tpl[0], bd=99;
  for(const t of R.shuffle(tpl)){ const d=Math.abs(t.diff-theta); if(d<bd){bd=d;best=t;} }
  G.cur={node, T:best, q:sanitizeQ(best.gen(nextR()))};
  G.attempts=0; G.hints=0; G.picked=null; G.lastNode=node.id;
  G.sub = G.cur.q.type==='steps' ? {i:0, errs:0, hints:0} : null;
}
function viewTrain(){
  if(!G || G.key!==CUR) initTrain();
  const s=S(), m=MAS(), {node,T,q}=G.cur;
  const mastered = s.nodes.filter(n=>m[n.id]>=0.75).length;
  const need = Math.max(2, Math.ceil(s.nodes.length*2/3));
  const goal = mastered>=need;
  return shell(`<div class="layout">
    <main>
      <section class="card pad">
        <div class="meta">
          <span class="eyebrow"><button class="link" onclick="go('subj')">← ${s.name}</button> · задача ${G.done+1}</span>
          <span class="tag geo">${node.id}</span>
          <span class="tag">${T.topic}</span>
          <span class="tag">${s.exam} № ${node.exam}</span>
        </div>
        <h2 class="stem">${q.stem}</h2>
        ${q.type==='steps' ? `
          <p class="p2note">Часть 2: решение записывается развёрнуто, и балл за запись ставит эксперт — мы этого не проверяем.
          Здесь разбирается <b>ход решения</b>: пройдите его по шагам, а в конце сверьте свою запись с образцом.</p>
          ${stepBar(q)}
          ${stepsDone(q) ? '' : `<p class="stepq"><b>Шаг ${G.sub.i+1} из ${q.steps.length}.</b> ${curStep(q).q}</p>`}` : ''}
        <p class="hintline">${(q.type==='steps' ? (curStep(q)&&curStep(q).hint) : q.hint)||(q.type==='multi'?'Можно выбрать несколько вариантов.':'')}</p>
        ${stepsDone(q) ? '' : answerBox(q,'checkTask()','<button class="ghost" onclick="showHint()">Подсказка</button>')}
        <div id="gfb"></div>
        <div class="hints" id="ghints"></div>
        <div class="row"><button class="link" onclick="reportBug()">В задании ошибка</button></div>
        <div id="bugbox"></div>
      </section>
      <p class="foot"><b>Как это работает.</b> Задачи подбираются по вашему уровню и перемешиваются между темами — так материал удерживается лучше,
      чем при решении подряд одной темы. Условия каждый раз новые, поэтому решить «по памяти» не получится.
      Прогресс хранится в вашем браузере; чтобы начать заново, <button class="link" onclick="resetTrain()">сбросьте его</button>.</p>
    </main>
    <aside class="rail">
      <div class="card pad">
        <h3>Цель <em>${mastered} из ${s.nodes.length}</em></h3>
        <div class="thr ${goal?'pass':'wait'}" style="margin:0">
          <span class="ic">${goal?'✓':'○'}</span>
          <div><b>${goal?'Набор закрыт':`Цель: ${need} навыка из ${s.nodes.length}`}</b>
          <p>${goal?'Этого набора хватает, чтобы уверенно брать основные баллы предмета.'
                  :`Освойте любые ${need} навыка на 75% — это самые «дешёвые» баллы предмета.`}</p></div>
        </div>
      </div>
      <div class="card pad">
        <h3>Навыки <em>P(освоено)</em></h3>
        ${s.nodes.map(n=>{const p=Math.round((m[n.id]||0)*100);
          const c=p>=75?'hi':p>=45?'mid':'lo';
          return `<div class="skill"><div class="nm">${n.name}<small>${n.id}</small></div>
            <div class="pc">${p}%</div><div class="bar"><i class="${c}" style="width:${p}%"></i></div></div>`;}).join('')}
      </div>
      <div class="card pad">
        <h3>Сегодня</h3>
        <div class="skill" style="border:0"><div class="nm">Решено задач</div><div class="pc">${G.solved}</div></div>
      </div>
    </aside>
  </div>`, subjChips(`<span class="chip">Освоено <b>${mastered} / ${s.nodes.length}</b></span>`), s.sub);
}
function showHint(){
  const q=G.cur.q;
  const list = q.type==='steps' ? ((curStep(q)&&curStep(q).hints)||q.hints||[]) : (q.hints||[]);
  if(G.hints>=list.length) return;
  $('#ghints').insertAdjacentHTML('beforeend',
    `<div class="hint"><b>Подсказка ${G.hints+1}.</b> ${list[G.hints]}</div>`);
  G.hints++;
}
function checkTask(){
  const q=G.cur.q;
  if(q.type==='steps') return checkStep();
  const node=G.cur.node, m=MAS();
  const inp=document.getElementById('ans');
  const g = grade(q, inp?inp.value:'', G.picked);
  if(!g) return;
  G.attempts++;
  const fb=$('#gfb');
  if(!g.ok){
    const mm=g.code?MIS[g.code]:null;
    fb.innerHTML = mm
      ? `<div class="fb err"><h4>Разберём <span class="code">${g.code}</span></h4><dl style="margin:0">
          <div class="slot"><dt>Что случилось</dt><dd>${mm.t}</dd></div>
          <div class="slot"><dt>Почему это ошибка</dt><dd>${mm.w}</dd></div>
          <div class="slot"><dt>Что сделать</dt><dd>${mm.d}</dd></div></dl></div>`
      : `<div class="fb err"><h4>Не сходится</h4><p style="margin:0">Проверьте ход решения и попробуйте ещё раз. Если застряли — возьмите подсказку.</p></div>`;
    if(G.attempts>=2) showHint();
    if(G.attempts>=4){
      fb.insertAdjacentHTML('beforeend',
        `<div class="fb ok" style="margin-top:12px"><h4>Верный ответ: ${esc(rightText(q))}</h4>
         <p style="margin:0">Разберите решение по подсказкам выше и идите дальше — эта тема вернётся.</p></div>`);
      m[node.id]=bkt(m[node.id],false); save(ST);
      nextBtn(fb,'Следующая задача');
    }
    if(inp) inp.select();
    return;
  }
  const clean = G.attempts===1 && G.hints===0;
  m[node.id]=bkt(m[node.id],clean); save(ST); G.solved++;
  fb.innerHTML=`<div class="fb ok"><h4>✓ Верно</h4><p style="margin:0">${clean
    ? 'С первой попытки и без подсказок — навык засчитан полностью.'
    : 'Правильно. Навык засчитан частично: понадобились попытки или подсказки, поэтому тема вернётся раньше.'}</p></div>`;
  nextBtn(fb,'Следующая задача');
}
/* Проверка одного шага задачи части 2. Пока шаги не кончились — двигаемся по ним;
   когда кончились, показываем образец записи и закрываем задачу. */
function checkStep(){
  const q=G.cur.q, node=G.cur.node, m=MAS(), st=curStep(q);
  const inp=document.getElementById('ans');
  const g = grade(st, inp?inp.value:'', G.picked);
  if(!g) return;
  G.attempts++;
  const fb=$('#gfb');
  if(!g.ok){
    G.sub.errs++;
    const mm=g.code?MIS[g.code]:null;
    fb.innerHTML = mm
      ? `<div class="fb err"><h4>Разберём <span class="code">${g.code}</span></h4><dl style="margin:0">
          <div class="slot"><dt>Что случилось</dt><dd>${mm.t}</dd></div>
          <div class="slot"><dt>Почему это ошибка</dt><dd>${mm.w}</dd></div>
          <div class="slot"><dt>Что сделать</dt><dd>${mm.d}</dd></div></dl></div>`
      : `<div class="fb err"><h4>На этом шаге не сходится</h4><p style="margin:0">Проверьте выкладки этого шага и попробуйте ещё раз.</p></div>`;
    if(G.attempts>=2) showHint();
    if(G.attempts>=4){
      fb.insertAdjacentHTML('beforeend',
        `<div class="fb ok" style="margin-top:12px"><h4>Ответ шага: ${esc(rightText(q))}</h4>
         <p style="margin:0">Разберите шаг и продолжайте — задача вернётся позже.</p></div>`);
      stepForward(true);
    }
    if(inp) inp.select();
    return;
  }
  fb.innerHTML=`<div class="fb ok"><h4>✓ Шаг пройден</h4><p style="margin:0">${st.note||'Идём дальше.'}</p></div>`;
  stepForward(false);
}
/* Переход к следующему шагу или завершение задачи. */
function stepForward(failed){
  const q=G.cur.q, node=G.cur.node, m=MAS(), fb=$('#gfb');
  G.sub.i++;
  G.attempts=0; G.picked=null;
  if(G.sub.i < q.steps.length){
    const b=document.createElement('button');
    b.textContent='Следующий шаг'; b.style.marginTop='16px';
    b.onclick=()=>{ render(); };
    fb.appendChild(b); b.focus();
    return;
  }
  const clean = G.sub.errs===0 && G.hints===0;
  m[node.id]=bkt(m[node.id], clean); save(ST); if(!failed) G.solved++;
  fb.insertAdjacentHTML('beforeend', `<div class="fb ok" style="margin-top:12px">
    <h4>Ход решения пройден</h4>
    <p style="margin:0 0 10px">${clean
      ? 'Все шаги с первой попытки и без подсказок — навык засчитан полностью.'
      : 'Шаги пройдены. Навык засчитан частично: были ошибки или подсказки, поэтому задача вернётся раньше.'}</p>
    <div class="model"><b>Как это записывают на экзамене</b><div>${q.model||''}</div>
      <p class="p2note" style="margin:10px 0 0">Балл за эту запись ставит эксперт по критериям — здесь мы её не оцениваем.
      Сравните свою запись с образцом: важны обоснования и то, что каждый переход виден.</p></div></div>`);
  nextBtn(fb,'Следующая задача');
}
function nextBtn(host,label){
  const b=document.createElement('button');
  b.textContent=label; b.style.marginTop='16px';
  b.onclick=()=>{ G.done++; nextTask(); render(); };
  host.appendChild(b); b.focus();
}
function resetTrain(){ ST.m[CUR]={}; save(ST); G=null; render(); }
function reportBug(){
  const {T,q}=G.cur;
  const step = q.type==='steps' ? ` (шаг ${(G.sub?G.sub.i:0)+1})` : '';
  const txt=`${S().name} · задание ${T.id}${step}: ${q.stem.replace(/<[^>]+>/g,'')} — ожидаемый ответ ${rightText(q)}`;
  const box=$('#bugbox');
  box.innerHTML=`<div class="fb err" style="margin-top:12px"><h4>Спасибо, это важно</h4>
    <p style="margin:0 0 8px">Скопируйте текст ниже и пришлите нам — задание уберём из выдачи в течение суток.</p>
    <div class="code" style="display:block;padding:10px;line-height:1.5;white-space:pre-wrap">${esc(txt)}</div></div>`;
}

/* ═══ ЭКРАН 5 · АТЛАС НАВЫКОВ ═══ */
let A = {br:'all', part:'all', q:''};
function atlasStatus(n){
  const m = ST.m[CUR]||{};
  if (m[n.id] !== undefined){
    const v=m[n.id];
    return v>=.75 ? {k:'ok', t:'освоено в тренажёре'}
         : v>=.45 ? {k:'mid', t:'в работе'}
                  : {k:'low', t:'нужна практика'};
  }
  const r = RES();
  if (r){
    const rel = r.items.filter(x=>x.node===n.id);
    if (rel.length){
      const p = rel.filter(x=>x.ok).length/rel.length;
      return p>=.7 ? {k:'ok', t:'диагностика — верно'}
           : p>0   ? {k:'mid', t:'диагностика — частично'}
                   : {k:'low', t:'диагностика — ошибка'};
    }
  }
  return {k:'na', t:'не проверено'};
}
function atlasFiltered(){
  const q=A.q.trim().toLowerCase(), at=ATLAS[CUR];
  if(!at) return [];
  return at.nodes.filter(n =>
    (A.br==='all' || n.br===A.br) &&
    (A.part==='all' || n.p===1) &&
    (!q || (n.t+' '+n.id).toLowerCase().includes(q)));
}
function atlasSet(k,v){
  A[k]=v;
  document.querySelectorAll('[data-af="'+k+'"]').forEach(b=>b.setAttribute('aria-pressed', b.dataset.av===String(v)));
  renderAtlasList();
}
function atlasSearch(v){ A.q=v; renderAtlasList(); }
function trainable(id){ return S().nodes.some(n=>n.id===id); }
function renderAtlasList(){
  const host=document.getElementById('atlist'); if(!host) return;
  const at=ATLAS[CUR], items=atlasFiltered();
  const cnt=document.getElementById('atcount');
  if(cnt) cnt.textContent = items.length+' из '+at.nodes.length;
  if(!items.length){ host.innerHTML='<p class="note" style="padding:26px 0;text-align:center">Ничего не нашлось. Снимите фильтр или измените запрос.</p>'; return; }
  const groups={};
  items.forEach(n=>(groups[n.br]=groups[n.br]||[]).push(n));
  host.innerHTML = Object.keys(groups).map(br=>{
    const rows = groups[br].map(n=>{
      const s=atlasStatus(n);
      return `<div class="anode ${s.k}">
        <span class="acode">${n.id}</span>
        <div class="abody"><b>${esc(n.t)}</b>
          <small>${n.g} класс · ${ATLAS_LEVEL[n.l]} уровень${n.pre?' · опирается на '+esc(n.pre):''}</small></div>
        <div class="ameta">
          <span class="atag">${S().exam} № ${esc(n.oge)}</span>
          <span class="astat ${s.k}">${s.t}</span>
          ${trainable(n.id)?`<button class="alink" onclick="go('train')">Тренировать →</button>`:''}
        </div></div>`;
    }).join('');
    return `<div class="agrp"><div class="agrph"><b>${at.branches[br]||br}</b><span>${groups[br].length}</span></div>${rows}</div>`;
  }).join('');
}
function viewAtlas(){
  const s=S(), at=ATLAS[CUR], r=RES();
  if(!at) return viewSubj();
  const p1 = at.nodes.filter(n=>n.p===1).length;
  const brs = Object.keys(at.branches);
  const grades = at.nodes.map(n=>parseInt(n.g,10)).filter(x=>!isNaN(x));
  return shell(`<div class="narrow" style="margin:0 auto">
    <section class="hero" style="margin-bottom:6px">
      <p class="eyebrow"><button class="link" onclick="go('subj')">← ${s.name}</button></p>
      <h1>Атлас навыков: что нужно знать к ${s.exam}</h1>
      <p>Не список тем из учебника, а карта проверяемых навыков: каждый привязан к номерам заданий ${s.exam} и к тому, на чём он держится.
      ${r ? 'Отмечено, что у вас просело по диагностике.' : 'Пройдите диагностику — и станет видно, что просело именно у вас.'}</p>
    </section>

    <div class="facts" style="margin:20px 0 6px">
      <div class="fact"><b>${at.nodes.length}</b><span>навыков с выходом на задания ${s.exam}</span></div>
      <div class="fact"><b>${p1}</b><span>из них в части 1 — на порог</span></div>
      <div class="fact"><b>${Math.min.apply(null,grades)}–${Math.max.apply(null,grades)}</b><span>классы</span></div>
    </div>

    <div class="afilters">
      <div class="achips">
        <button class="chipbtn" data-af="br" data-av="all" aria-pressed="${A.br==='all'}" onclick="atlasSet('br','all')">Все ветки</button>
        ${brs.map(b=>`<button class="chipbtn" data-af="br" data-av="${b}" aria-pressed="${A.br===b}" onclick="atlasSet('br','${b}')">${at.branches[b]}</button>`).join('')}
      </div>
      <div class="achips">
        <button class="chipbtn" data-af="part" data-av="all" aria-pressed="${A.part==='all'}" onclick="atlasSet('part','all')">Весь экзамен</button>
        <button class="chipbtn" data-af="part" data-av="p1" aria-pressed="${A.part==='p1'}" onclick="atlasSet('part','p1')">Только часть 1</button>
      </div>
      <input type="search" class="asearch" placeholder="Поиск по навыку" aria-label="Поиск по навыку"
             value="${esc(A.q)}" oninput="atlasSearch(this.value)">
      <span class="acount" id="atcount"></span>
    </div>

    <div id="atlist"></div>

    ${r ? '' : `<div class="card pad" style="margin-top:22px">
      <span class="eyebrow">Следующий шаг</span>
      <p style="margin:8px 0 0;font-size:14.5px;color:var(--ink-2)">Атлас показывает всю карту. Чтобы увидеть на ней свои пробелы, нужна диагностика — ${CFG.diagLen} заданий, 20–25 минут, без регистрации.</p>
      <div class="row"><button onclick="startDiag()">Пройти диагностику →</button></div>
    </div>`}

    <p class="foot"><b>Откуда карта.</b> Таксономия построена от ФГОС и федеральных рабочих программ — это официальные документы, не объект авторских прав.
    Номера заданий ${s.exam} указаны как ориентир для сопоставления; тексты заданий ФИПИ здесь не воспроизводятся.
    Полная версия атласа охватывает шесть предметов и классы 5–11; здесь показано то, что выходит на ${s.exam}.</p>
  </div>`, subjChips(`<span class="chip"><b>${at.nodes.length}</b> ${plNav(at.nodes.length)}</span>`), s.sub);
}

/* ═══ РЕНДЕР ═══ */
function render(){
  const html = view==='home'   ? viewHome()
             : view==='subj'   ? viewSubj()
             : view==='diag'   ? viewDiag()
             : view==='result' ? viewResult()
             : view==='atlas'  ? viewAtlas()
             : view==='class'  ? viewClass()
             : viewTrain();
  document.getElementById('app').innerHTML = html;
  if(view==='atlas') renderAtlasList();
  const inp = document.getElementById('ans');
  if(inp){ inp.focus(); inp.onkeydown=e=>{ if(e.key==='Enter'){ view==='diag'?submitDiag():checkTask(); } }; }
}
setInterval(()=>{
  const c=document.getElementById('clock');
  if(c&&D){ const s=Math.floor((Date.now()-D.t0)/1000);
    c.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
},1000);
render();

</script>
</body>
</html>
