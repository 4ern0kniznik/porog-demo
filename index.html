<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Диагностика навыков ОГЭ за 20 минут и тренажёры по математике, физике, информатике, русскому языку, истории и обществознанию. Бесплатно, без регистрации.">
<title>Научился · тренажёр ОГЭ по шести предметам</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700&family=Golos+Text:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#F6F8F6; --surface:#FFFFFF; --surface-2:#EFF3F1;
  --ink:#14201C; --ink-2:#41524C; --ink-3:#6E817A;
  --rule:#DCE3E0; --rule-strong:#C3CFCA;
  --accent:#0F6E62; --accent-ink:#0B5249; --accent-soft:#DBEAE6; --on-accent:#FFFFFF;
  --moss:#3D7A33; --moss-soft:#E0EEDC;
  --ochre:#9C6209; --ochre-soft:#F6ECD9;
  --clay:#A33A2C; --clay-soft:#F7E4E0;
  --grid:rgba(15,110,98,.055);
  --shadow:0 1px 2px rgba(20,32,28,.05), 0 8px 24px -12px rgba(20,32,28,.18);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0F1513; --surface:#171F1C; --surface-2:#1E2724;
  --ink:#E7EDEA; --ink-2:#AFBEB8; --ink-3:#83958E;
  --rule:#27322E; --rule-strong:#36443F;
  --accent:#54C3AF; --accent-ink:#7FD8C7; --accent-soft:#16332E; --on-accent:#0F1513;
  --moss:#82BC70; --moss-soft:#1B2A18;
  --ochre:#D9A24A; --ochre-soft:#2C2314;
  --clay:#DE8375; --clay-soft:#2E1B17;
  --grid:rgba(84,195,175,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#0F1513; --surface:#171F1C; --surface-2:#1E2724;
  --ink:#E7EDEA; --ink-2:#AFBEB8; --ink-3:#83958E;
  --rule:#27322E; --rule-strong:#36443F;
  --accent:#54C3AF; --accent-ink:#7FD8C7; --accent-soft:#16332E; --on-accent:#0F1513;
  --moss:#82BC70; --moss-soft:#1B2A18;
  --ochre:#D9A24A; --ochre-soft:#2C2314;
  --clay:#DE8375; --clay-soft:#2E1B17;
  --grid:rgba(84,195,175,.05);
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"Golos Text",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:26px 26px;}
h1,h2,h3{font-family:Bitter,Georgia,serif;text-wrap:balance;margin:0;letter-spacing:-.01em}
sup{font-size:.72em}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
.narrow{max-width:760px}

/* ── шапка ── */
header.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--ground) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule);margin-bottom:26px}
.top-in{max-width:1120px;margin:0 auto;padding:12px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{display:flex;gap:11px;align-items:center;margin-right:auto;cursor:pointer;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit}
.mark{width:30px;height:30px;border-radius:7px;background:var(--accent);color:var(--on-accent);
  display:grid;place-items:center;font-family:Bitter,serif;font-weight:700;font-size:15px;flex:none}
.brand b{font-family:Bitter,serif;font-size:16px;font-weight:700;display:block;line-height:1.2}
.brand span{font-size:12px;color:var(--ink-3);display:block}
.chip{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:99px;
  border:1px solid var(--rule-strong);background:var(--surface);font-size:12.5px;color:var(--ink-2)}
.chip b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip.pred{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.chip.pred b{color:var(--accent-ink)}

/* ── карточки ── */
.card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow)}
.pad{padding:22px 24px}
@media(max-width:520px){.pad{padding:18px 16px}}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.tag{font-size:11px;padding:3px 8px;border-radius:5px;background:var(--surface-2);color:var(--ink-2);
  font-family:"JetBrains Mono",monospace;letter-spacing:.02em}
.tag.geo{background:var(--accent-soft);color:var(--accent-ink)}

/* ── главный экран ── */
.hero{padding:34px 0 8px}
.hero h1{font-size:clamp(28px,4.4vw,42px);line-height:1.12;margin-bottom:14px}
.hero p{font-size:17.5px;color:var(--ink-2);max-width:62ch;margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:26px 0}
.tile{display:flex;flex-direction:column;gap:12px;padding:24px;border:1px solid var(--rule);border-radius:12px;
  background:var(--surface);box-shadow:var(--shadow);text-align:left;font:inherit;color:inherit;cursor:pointer;
  transition:transform .14s,border-color .14s}
.tile:hover{transform:translateY(-2px);border-color:var(--accent)}
.tile h2{font-size:20px}
.tile p{margin:0;color:var(--ink-2);font-size:14.5px;flex:1}
.tile .go{color:var(--accent-ink);font-weight:600;font-size:14.5px}
.tile .badge{align-self:flex-start;font-size:11px;padding:3px 9px;border-radius:99px;background:var(--accent-soft);
  color:var(--accent-ink);font-weight:600;letter-spacing:.03em;text-transform:uppercase}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:10px;overflow:hidden;margin-top:8px}
.fact{background:var(--surface);padding:16px 18px}
.fact b{display:block;font-family:Bitter,serif;font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.fact span{font-size:12.5px;color:var(--ink-3)}

/* ── задание ── */
.stem{font-size:18.5px;line-height:1.5;margin:0 0 6px}
.stem b{font-weight:600}
.hintline{color:var(--ink-3);font-size:13.5px;margin-top:2px}
.answer{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
input[type=text]{flex:1 1 200px;min-width:0;padding:11px 14px;border:1.5px solid var(--rule-strong);border-radius:8px;
  background:var(--surface);color:var(--ink);font-family:"JetBrains Mono",monospace;font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
button{font-family:inherit;font-size:14.5px;font-weight:600;padding:11px 20px;border-radius:8px;
  border:1.5px solid transparent;background:var(--accent);color:var(--on-accent);cursor:pointer;transition:filter .15s}
button:hover{filter:brightness(1.08)}
button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}
button.ghost{background:transparent;color:var(--ink-2);border-color:var(--rule-strong)}
button.ghost:hover{background:var(--surface-2);filter:none}
button.link{background:none;border:0;color:var(--ink-3);padding:4px 0;font-size:13px;text-decoration:underline;
  text-underline-offset:3px;font-weight:400}
button.link:hover{color:var(--accent-ink);filter:none}
button:disabled{opacity:.45;cursor:not-allowed}
.opts{display:grid;gap:9px;margin-top:18px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1.5px solid var(--rule);border-radius:8px;
  background:var(--surface);cursor:pointer;text-align:left;font-size:15.5px;color:var(--ink);font-family:inherit;
  font-weight:400;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--rule-strong);background:var(--surface-2)}
.opt .k{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);padding-top:3px;flex:none;width:15px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.correct{border-color:var(--moss);background:var(--moss-soft)}
.opt.wrong{border-color:var(--clay);background:var(--clay-soft)}
.opt:disabled{cursor:default;opacity:1;color:var(--ink);-webkit-text-fill-color:var(--ink)}

/* ── обратная связь ── */
.fb{margin-top:18px;border-radius:9px;border:1px solid;padding:16px 18px;font-size:14.5px;line-height:1.55}
.fb.ok{border-color:var(--moss);background:var(--moss-soft)}
.fb.err{border-color:var(--ochre);background:var(--ochre-soft)}
.fb h4{font-family:Bitter,serif;font-size:15px;margin:0 0 10px;display:flex;gap:9px;align-items:center}
.slot{display:grid;grid-template-columns:136px 1fr;gap:4px 14px;padding:7px 0;border-top:1px dashed var(--rule-strong)}
.slot:first-of-type{border-top:none}
.slot dt{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding-top:2px}
.slot dd{margin:0;color:var(--ink)}
@media(max-width:560px){.slot{grid-template-columns:1fr;gap:2px}}
.code{font-family:"JetBrains Mono",monospace;font-size:11.5px;padding:2px 7px;border-radius:4px;
  background:var(--surface);border:1px solid var(--rule-strong);color:var(--ink-2)}
.hints{margin-top:14px;display:grid;gap:7px}
.hint{font-size:14px;padding:10px 13px;border-left:2.5px solid var(--accent);background:var(--surface-2);border-radius:0 6px 6px 0}

/* ── прогресс ── */
.pbar{height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin:2px 0 18px}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}
.skill{display:grid;grid-template-columns:1fr 44px;gap:4px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--rule)}
.skill:first-of-type{border-top:none}
.skill .nm{font-size:13.5px;line-height:1.3}
.skill .nm small{display:block;font-family:"JetBrains Mono",monospace;font-size:10.5px;color:var(--ink-3)}
.skill .pc{font-family:"JetBrains Mono",monospace;font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.bar{grid-column:1/-1;height:5px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink-3);transition:width .55s cubic-bezier(.2,.7,.3,1),background .3s}
.bar i.lo{background:var(--clay)} .bar i.mid{background:var(--ochre)} .bar i.hi{background:var(--moss)}

/* ── результат ── */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media(max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}}
main{display:grid;align-content:start;gap:0}
.rail{display:grid;gap:16px;position:sticky;top:72px}
@media(max-width:940px){.rail{position:static}}
.rail h3{font-size:13px;font-family:Bitter,serif;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.rail h3 em{font-style:normal;font-size:11px;color:var(--ink-3);font-weight:400;font-family:"Golos Text",sans-serif}
.score{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.score b{font-family:Bitter,serif;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:12.5px;color:var(--ink-3)}
.scale{height:7px;border-radius:99px;background:var(--surface-2);position:relative;margin:14px 0 8px;overflow:hidden}
.scale i{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.85;transition:left .5s,width .5s}
.legend{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);font-family:"JetBrains Mono",monospace}
.thr{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:9px;border:1px solid;margin:18px 0}
.thr.pass{border-color:var(--moss);background:var(--moss-soft)}
.thr.fail{border-color:var(--clay);background:var(--clay-soft)}
.thr.wait{border-color:var(--rule-strong);background:var(--surface-2)}
.thr .ic{font-family:Bitter,serif;font-size:22px;line-height:1;flex:none}
.thr b{display:block;font-size:15px;margin-bottom:3px}
.thr p{margin:0;font-size:14px;color:var(--ink-2)}
.gap-list{display:grid;gap:10px;margin:16px 0}
.gap{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:12px 14px;border-radius:8px;border:1px solid var(--rule);background:var(--surface-2)}
.gap b{font-size:14.5px;font-weight:600}
.gap small{grid-column:1/-1;font-size:12.5px;color:var(--ink-2)}
.gap .v{font-family:"JetBrains Mono",monospace;font-size:12.5px;color:var(--clay);font-variant-numeric:tabular-nums}
.gap.ok .v{color:var(--moss)}
table.rev{width:100%;border-collapse:collapse;font-size:14px;margin-top:10px}
table.rev th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);
  font-weight:600;padding:6px 10px 6px 0;border-bottom:1px solid var(--rule)}
table.rev td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:top}
table.rev td:last-child{padding-right:0}
.dotmark{display:inline-block;width:9px;height:9px;border-radius:99px;flex:none;margin-top:6px}
.dotmark.y{background:var(--moss)} .dotmark.n{background:var(--clay)}
.tblwrap{overflow-x:auto}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.foot{margin-top:28px;padding-top:18px;border-top:1px solid var(--rule);font-size:12.5px;color:var(--ink-3)}
.foot b{color:var(--ink-2);font-weight:600}
.foot a{color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center}

/* ═══ АТЛАС НАВЫКОВ ═══ */
.afilters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;
  position:sticky;top:0;z-index:8;padding:14px 0 12px;margin-top:14px;
  background:var(--ground);border-bottom:1px solid var(--rule)}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{font:inherit;font-size:13px;padding:5px 12px;border-radius:99px;cursor:pointer;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);
  transition:background .13s,color .13s,border-color .13s}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:500}
.chipbtn:focus-visible,.asearch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.asearch{font:inherit;font-size:14px;padding:6px 13px;border-radius:99px;flex:1 1 190px;min-width:170px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink)}
.acount{font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3);
  white-space:nowrap;font-variant-numeric:tabular-nums;margin-left:auto}

.agrp{margin-top:24px}
.agrph{display:flex;align-items:baseline;gap:10px;padding-bottom:7px;
  border-bottom:1px solid var(--rule-strong);margin-bottom:8px}
.agrph b{font-family:Bitter,Georgia,serif;font-size:16px}
.agrph span{margin-left:auto;font-family:"JetBrains Mono",monospace;font-size:12px;color:var(--ink-3)}

.anode{display:grid;grid-template-columns:104px 1fr auto;gap:8px 14px;align-items:center;
  padding:11px 14px;border:1px solid var(--rule);border-left-width:3px;border-radius:8px;
  background:var(--surface);margin-bottom:7px}
.anode.ok{border-left-color:var(--moss)}
.anode.mid{border-left-color:var(--ochre)}
.anode.low{border-left-color:var(--clay)}
.anode.na{border-left-color:var(--rule-strong)}
.acode{font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.abody b{display:block;font-size:14.5px;font-weight:600;line-height:1.35}
.abody small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.ameta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.atag{font-family:"JetBrains Mono",monospace;font-size:11px;padding:2px 8px;border-radius:99px;
  border:1px solid var(--rule-strong);color:var(--ink-2);white-space:nowrap}
.astat{font-size:11.5px;padding:2px 9px;border-radius:99px;white-space:nowrap}
.astat.ok{background:var(--moss-soft);color:var(--moss)}
.astat.mid{background:var(--ochre-soft);color:var(--ochre)}
.astat.low{background:var(--clay-soft);color:var(--clay)}
.astat.na{background:var(--surface-2);color:var(--ink-3)}
.alink{font:inherit;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:99px;cursor:pointer;
  border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.alink:hover{background:var(--accent);color:var(--on-accent)}

@media (max-width:680px){
  .anode{grid-template-columns:1fr;gap:4px}
  .ameta{justify-content:flex-start}
  .acount{margin-left:0}
}

/* ═══ ВЫБОР ПРЕДМЕТА ═══ */
.subjgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:26px 0}
.subjcard{display:flex;flex-direction:column;gap:14px;padding:20px;text-align:left;cursor:pointer;
  border:1px solid var(--rule);border-top:3px solid var(--sc,var(--accent));border-radius:12px;
  background:var(--surface);box-shadow:var(--shadow);font:inherit;color:var(--ink);
  transition:transform .14s,border-color .14s}
.subjcard:hover{transform:translateY(-2px);border-color:var(--sc,var(--accent))}
.subjcard:focus-visible{outline:2px solid var(--sc,var(--accent));outline-offset:3px}
.sc-math{--sc:var(--accent)} .sc-phy{--sc:var(--clay)} .sc-inf{--sc:var(--moss)}
.sc-rus{--sc:#8E3A5B} .sc-his{--sc:var(--ochre)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .sc-rus{--sc:#D488A6} }
:root[data-theme="dark"] .sc-rus{--sc:#D488A6}
.sc-head b{display:block;font-family:Bitter,Georgia,serif;font-size:18px;line-height:1.2}
.sc-head span{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}
.sc-body{display:flex;align-items:baseline;gap:7px}
.sc-n{font-family:Bitter,Georgia,serif;font-size:30px;font-weight:700;color:var(--sc);font-variant-numeric:tabular-nums}
.sc-l{font-size:12.5px;color:var(--ink-3)}
.sc-foot{display:flex;flex-wrap:wrap;gap:5px;margin-top:auto}
.sc-badge{font-size:11.5px;padding:2px 9px;border-radius:99px;background:var(--surface-2);color:var(--ink-3)}
.sc-badge.on{background:color-mix(in srgb,var(--sc) 15%,transparent);color:var(--sc)}
.flash{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;
  background:var(--ink);color:var(--ground);padding:9px 18px;border-radius:99px;font-size:14px;box-shadow:var(--shadow)}

/* ═══ Код результата для отчёта родителям ═══
   Кегль блока — по макету R-01 (Контора/макеты/R-01-kanal-dostavki/01-otchet-dlya-roditeley.html)
   и порогу конторы из Контора/макеты/токены.md: 16px тело, 14px нижняя граница служебного.
   Ниже 14px в этом блоке опускаться нельзя — проверяется demo/src/test-report.js. */
.rc{margin-top:26px;padding:18px 20px;border:1px solid var(--rule);border-radius:12px;background:var(--surface-2)}
.rc h3{font-size:18px;margin:0 0 8px}
.rc p{font-size:16px;line-height:1.5;margin:0 0 12px;color:var(--ink-2)}
.rc-subj{font-size:16px;margin-bottom:12px}
.rc-code{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:14px;line-height:1.5;
  word-break:break-all;padding:12px 14px;border-radius:9px;border:1px dashed var(--rule);
  background:var(--surface);color:var(--ink-3);max-height:76px;overflow-y:auto;margin-bottom:12px}
.rc-code.ready{border-style:solid;color:var(--ink-2);user-select:all}
.rc-link{color:var(--ink-2);border-style:solid;user-select:all}
a.rc-goto{font-family:inherit;font-size:16px;font-weight:600;padding:11px 20px;border-radius:8px;
  border:1.5px solid var(--rule-strong);background:transparent;color:var(--ink-2);text-decoration:none}
a.rc-goto:hover{background:var(--surface)}
.rc .row button{font-size:16px}
.rc-qr{display:flex;gap:12px;align-items:center;margin-top:14px}
.rc-qr .rc-qr-box{width:64px;height:64px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px dashed var(--rule-strong);border-radius:6px;font-size:14px;color:var(--ink-3)}
.rc-qr p{font-size:14px;line-height:1.5;margin:0;color:var(--ink-3)}
.rc-where{font-size:14px;line-height:1.5;margin:12px 0 0;color:var(--ink-2)}
.rc-note{font-size:14px;margin:12px 0 0;color:var(--ink-3)}

/* ─── Сводка по классу (экран учителя) ─────────────────────────────────── */
.teacher{display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;
  background:var(--surface);border:1px solid var(--rule);border-radius:10px;
  padding:18px 20px;margin:22px 0 0;box-shadow:var(--shadow)}
.teacher b{display:block;font-family:Bitter,Georgia,serif;font-size:16px;margin-bottom:5px}
.teacher p{margin:0;font-size:14px;color:var(--ink-2);max-width:56ch}
.card{padding:20px 22px;margin:18px 0}
.card h2{font-size:19px;margin-bottom:8px}
.card h3{font-size:14.5px;margin:20px 0 8px}
.card.warn{border-color:#E2C79A;background:#FDF7EC}
.muted{color:var(--ink-3)}
.small{font-size:12.5px}
.cl-ta{width:100%;box-sizing:border-box;font-family:'JetBrains Mono',ui-monospace,monospace;
  font-size:12px;line-height:1.5;padding:12px 13px;border:1px solid var(--rule-strong);
  border-radius:9px;background:var(--bg);color:var(--ink);resize:vertical}
.cl-actions{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 10px}
.cl-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.cl-t{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
.cl-t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
  color:var(--ink-3);font-weight:600;padding:0 10px 7px 0;border-bottom:1px solid var(--rule)}
.cl-t td{padding:9px 10px 9px 0;border-bottom:1px solid var(--rule);vertical-align:middle}
.cl-t td:last-child,.cl-t th:last-child{padding-right:0}
.cl-pct{white-space:nowrap}
.cl-bar{display:inline-block;width:88px;height:7px;border-radius:99px;background:var(--rule);
  vertical-align:middle;margin-right:8px;overflow:hidden}
.cl-bar i{display:block;height:100%;border-radius:99px}
.cl-bar i.bad{background:#A33A2C}.cl-bar i.mid{background:#9C6209}.cl-bar i.ok{background:#0F6E62}
.cl-list{margin:6px 0 0;padding-left:18px;font-size:14px}
.cl-list li{margin:5px 0}
.cl-err{margin:6px 0 0;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.cl-plan{margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule);font-size:14.5px}
@media print{
  .teacher,.cl-actions,.back,.top{display:none}
  .card{break-inside:avoid;box-shadow:none}
}
@media (max-width:560px){
  .teacher{align-items:flex-start;flex-direction:column}
  .cl-bar{width:56px}
}

/* ─── Памятка и QR на экране учителя ───────────────────────────────────── */
.cl-how-in{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
.cl-steps{margin:6px 0 0;padding-left:20px;font-size:14.5px;max-width:52ch}
.cl-steps li{margin:8px 0}
.cl-qr{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:170px}
button.qr-thumb{padding:8px;background:#fff;border:1px solid var(--rule);border-radius:10px;cursor:zoom-in}
button.qr-thumb svg{display:block;width:150px;height:150px}
.cl-url{font-size:12.5px;color:var(--ink-3);text-decoration:none;word-break:break-all;text-align:center}
.cl-url:hover{color:var(--accent)}
#qr-full{position:fixed;inset:0;z-index:60;background:rgba(20,32,28,.92);
  display:grid;place-items:center;cursor:zoom-out;padding:24px}
#qr-full .qr-box{background:#fff;padding:26px 26px 18px;border-radius:16px;text-align:center;max-width:min(78vh,560px)}
#qr-full svg{display:block;width:min(70vh,480px);height:auto}
#qr-full p{margin:14px 0 2px;font:600 16px/1.3 Bitter,Georgia,serif;color:#14201C;word-break:break-all}
#qr-full span{font-size:12.5px;color:#6E817A}
@media print{ .cl-how{display:none} }
@media (max-width:560px){ .cl-how-in{flex-direction:column} .cl-qr{align-self:center} }

/* ─── Пошаговые задания части 2 ────────────────────────────────────────── */
.p2note{font-size:13.5px;color:var(--ink-3);background:var(--bg);border-left:3px solid var(--rule-strong);
  padding:10px 12px;border-radius:0 8px 8px 0;margin:12px 0}
.steps-bar{display:flex;gap:8px;margin:14px 0 10px}
.steps-bar .st{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;
  font:600 12.5px/1 'JetBrains Mono',ui-monospace,monospace;color:var(--ink-3);
  background:var(--bg);border:1px solid var(--rule-strong)}
.steps-bar .st.now{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.steps-bar .st.done{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent-ink)}
.stepq{margin:6px 0 4px;font-size:16px}
.model{background:var(--bg);border:1px solid var(--rule);border-radius:9px;padding:12px 14px;font-size:14px}
.model>div{margin-top:6px;line-height:1.6}

</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══ КАТАЛОГ ТИПОВЫХ ОШИБОК ═══
   Каждый код: t — что произошло, w — почему это ошибка, d — что сделать.
   Основа для четырёхслотовой обратной связи. */
const MIS = {
'M.PCT.01':{t:'Проценты сложены как числа',w:'Первый процент берётся от исходной цены, второй — уже от новой. Базы разные, складывать их нельзя.',d:'Пересчитайте второй шаг от цены после первого изменения.'},
'M.PCT.02':{t:'Проценты считаны от одной базы',w:'«Выросло и упало на столько же — вернулось» верно только если база не менялась. Здесь она изменилась.',d:'Найдите цену после первого шага, потом берите процент уже от неё.'},
'M.ARI.02':{t:'Округление вверх вместо вниз',w:'На остаток товар не купить — округлять нужно вниз.',d:'Возьмите целую часть частного.'},
'M.ARI.03':{t:'Ответ не целый',w:'Количество предметов — целое число.',d:'Отбросьте дробную часть.'},
'M.ARI.04':{t:'Умножение вместо деления',w:'Деление на дробь меньше единицы увеличивает число, а не уменьшает.',d:'Разделите произведение на последний множитель.'},
'M.POW.01':{t:'Показатели перемножены',w:'Показатели перемножаются при возведении степени в степень, а не при умножении степеней.',d:'При умножении степеней с одинаковым основанием показатели складываются.'},
'M.POW.02':{t:'Все показатели сложены',w:'При делении показатель вычитается, а не прибавляется.',d:'Сложите показатели множителей и вычтите показатель делителя.'},
'M.SQRT.01':{t:'Взят только один множитель',w:'Извлечён корень не из всего произведения.',d:'√a · √b = √(ab). Перемножьте подкоренные выражения.'},
'M.SQRT.02':{t:'Корень не извлечён',w:'Вы нашли подкоренное выражение, но остановились на шаг раньше.',d:'Извлеките корень из полученного числа.'},
'M.FSU.02':{t:'Применена формула квадрата разности',w:'a² − b² — это разность квадратов, а не квадрат разности.',d:'a² − b² = (a − b)(a + b).'},
'M.FSU.03':{t:'Взят только один множитель',w:'(a − b) — половина ответа: второй множитель потерян.',d:'Умножьте разность на сумму.'},
'M.RAT.03':{t:'Сокращён не тот множитель',w:'После разложения числителя сокращается общий множитель, и остаётся другая скобка.',d:'Проверьте, какая скобка остаётся после сокращения.'},
'M.PROC.01':{t:'Выполнен только первый шаг',w:'Найдена промежуточная величина, а не то, что спрашивают.',d:'Перечитайте вопрос: остался ещё один шаг.'},
'M.PROC.02':{t:'Упрощение не выполнено',w:'Подстановка без упрощения приводит к громоздким вычислениям и ошибке.',d:'Сначала разложите и сократите, потом подставляйте число.'},
'M.PROC.04':{t:'Найдена не та из двух величин',w:'Вычисления верные, но в ответ пошло не то число, которое требуется.',d:'Перечитайте, что именно просят: больший или меньший.'},
'M.PROC.05':{t:'Перепутаны действия',w:'Здесь нужно не вычитание, а деление и последующее сложение.',d:'Выразите скобку, потом найдите x.'},
'M.PROC.06':{t:'Найдена другая переменная',w:'Система решена верно, но в ответ записан y вместо x.',d:'Перечитайте, что просят записать в ответ.'},
'M.EQ.01':{t:'Потерян знак корня',w:'Знак корня противоположен знаку в скобке разложения.',d:'Проверьте подстановкой: подставьте найденный корень в уравнение.'},
'M.ODZ.03':{t:'Корень обращает знаменатель в ноль',w:'Такое значение не входит в область допустимых значений — это посторонний корень.',d:'Всегда сверяйте найденные корни с ОДЗ.'},
'M.PRB.01':{t:'Вероятности сложены',w:'Сумма вероятностей работает только для несовместных событий. Здесь события могут произойти одновременно, и результат больше единицы — это уже сигнал ошибки.',d:'Перейдите к противоположному событию: «ни одного».'},
'M.PRB.02':{t:'Найдена вероятность обоих событий',w:'Произведение даёт вероятность того, что произошли оба, а спрашивается «хотя бы один».',d:'«Хотя бы один» = 1 − P(ни одного).'},
'M.PRB.03':{t:'Решение не завершено',w:'Это вероятность того, что не произошло ничего. Вы почти у цели.',d:'Вычтите полученное число из единицы.'},
'M.PRB.05':{t:'Отношение вместо вероятности',w:'Вероятность — это доля от ВСЕХ исходов, а не отношение одной части к другой.',d:'В знаменателе должно быть общее количество.'},
'M.PRB.06':{t:'Найдена вероятность противоположного',w:'Посчитана доля не того цвета.',d:'Перечитайте, какое событие требуется.'},
'M.STAT.01':{t:'Найдено среднее вместо медианы',w:'Среднее и медиана — разные величины: среднее чувствительно к выбросам, медиана нет.',d:'Медиана — середина упорядоченного ряда.'},
'M.STAT.02':{t:'Ряд не упорядочен',w:'Взят средний по счёту элемент исходного набора, а не упорядоченного.',d:'Сначала расставьте числа по возрастанию.'},
'M.FUN.01':{t:'Потерян знак в формуле вершины',w:'x₀ = −b/(2a): минус перед b обязателен.',d:'Проверьте знак коэффициента b и знак самой формулы.'},
'M.FUN.02':{t:'Взят свободный член',w:'Свободный член c не влияет на абсциссу вершины — он сдвигает параболу по вертикали.',d:'Используйте только a и b.'},

'M.FUN.04':{t:'Перепутан порядок вычитания',w:'Числитель и знаменатель должны идти в одном порядке: из второй точки вычитаем первую и там, и там.',d:'Проверьте знаки при вычитании отрицательных координат.'},
'M.ALG.01':{t:'Забыта двойка',w:'В формуле площади есть деление на 2 — при выражении высоты оно превращается в умножение.',d:'h = 2S / (a + b).'},
'M.ALG.02':{t:'Основания перемножены',w:'В формуле стоит СУММА оснований, а не произведение.',d:'В знаменателе должно быть (a + b).'},
'M.INEQ.01':{t:'Знак неравенства перевёрнут',w:'Знак меняется только при делении на отрицательное число. Здесь коэффициент положительный.',d:'Проверьте знак множителя перед x.'},
'M.INEQ.02':{t:'Потерян знак при переносе',w:'При переносе числа через знак неравенства оно меняет знак.',d:'Перенесите свободный член и проверьте его знак.'},
'M.INT.02':{t:'Знаки на интервалах определены неверно',w:'Парабола с положительным старшим коэффициентом отрицательна МЕЖДУ корнями, а не вне их.',d:'Подставьте любое число между корнями и проверьте знак.'},
'M.INT.04':{t:'Границы исключены при нестрогом знаке',w:'Знак ≤ означает, что нули выражения тоже подходят.',d:'Включите концы отрезка.'},
'M.INT.05':{t:'Границы записаны в обратном порядке',w:'В записи промежутка сначала идёт меньшее число.',d:'Поменяйте границы местами.'},
'M.SEQ.01':{t:'Взято n вместо n − 1',w:'От первого члена до n-го делается n − 1 шаг, а не n.',d:'aₙ = a₁ + (n − 1)d.'},
'M.SEQ.02':{t:'Формула заменена произведением',w:'Это формула геометрической прогрессии, а не арифметической.',d:'В арифметической разность прибавляется, а не умножается.'},
'M.SIM.01':{t:'Площадь умножена на коэффициент',w:'Так относятся линейные размеры, а площади — как квадрат коэффициента.',d:'Умножьте на k², а не на k.'},

'M.ANG.01':{t:'Взято дополнение до 90°',w:'Смежные углы дополняют друг друга до развёрнутого, а не до прямого.',d:'Сумма смежных углов — 180°.'},
'M.ANG.02':{t:'Взято дополнение до 360°',w:'360° — это полный угол, а смежные дают развёрнутый.',d:'Вычитайте из 180°.'},
'M.ANG.03':{t:'Углы приняты равными',w:'Равны вертикальные углы, а смежные равны только если оба по 90°.',d:'Смежные в сумме дают 180°.'},
'M.ANG.04':{t:'Разность принята за сам угол',w:'Дана разность углов, а не один из них.',d:'Составьте уравнение: x и x + d в сумме дают 180°.'},
'M.ANG.05':{t:'Односторонние приняты за равные',w:'Равны накрест лежащие и соответственные углы. Односторонние дают в сумме 180°.',d:'Вычтите данный угол из 180°.'},
'M.ANG.06':{t:'Половина принята за целое',w:'Биссектриса делит угол пополам — значит весь угол вдвое больше.',d:'Умножьте на 2.'},

'M.GEO.01':{t:'Найдена гипотенуза, а не высота',w:'Высота к гипотенузе короче любого катета.',d:'Посчитайте площадь двумя способами и приравняйте.'},
'M.GEO.02':{t:'Найдена площадь',w:'Это промежуточная величина, а не ответ на вопрос.',d:'Подставьте её во вторую формулу площади.'},
'M.GEO.03':{t:'Взято среднее катетов',w:'Высота к гипотенузе не связана со средним арифметическим катетов.',d:'Приравняйте две записи площади: ab/2 = ch/2.'},

'M.GEO.12':{t:'Умножено вместо деления',w:'Вдвое больше дуги — это не вписанный угол.',d:'Вписанный угол = дуга : 2.'},
'M.GEO.13':{t:'Взято дополнение до 180°',w:'Связь вписанного угла с дугой — деление пополам, а не вычитание.',d:'Разделите дугу на 2.'},
'M.GEO.14':{t:'Средняя линия принята равной стороне',w:'Средняя линия вдвое короче стороны, которой параллельна.',d:'Разделите на 2.'},
'M.GEO.15':{t:'Умножено вместо деления',w:'Средняя линия короче стороны, а не длиннее.',d:'Разделите на 2.'},

'M.GEO.17':{t:'Использован не тот угол',w:'Внешний угол при вершине C связан с углами A и B, а не с одним из них.',d:'Сложите два не смежных внутренних угла.'},

/* склонение существительного при числительном: 1 шар · 2 шара · 5 шаров */
function M_SHAR(n){const a=n%100, b=n%10;
  if(a>10&&a<20) return 'шаров';
  if(b===1) return 'шар';
  if(b>=2&&b<=4) return 'шара';
  return 'шаров';}

/* множитель (x − c) в читаемом виде: c<0 → (x + |c|), c=0 → x */
function M_FACT(c){ return c===0 ? 'x' : (c<0 ? `(x + ${-c})` : `(x − ${c})`); }

/* Санитайзер: параметризация иногда порождает дистрактор, совпавший с верным
   ответом. Убираем такие — ученик не должен видеть «неверно» на верное число. */
function sanitize(q){
  if(q.type==='num' && q.wrong){
    const w={}; const tol=q.tol||0.001;
    for(const k in q.wrong){ const v=parseFloat(k);
      if(isFinite(v) && Math.abs(v-q.ans)>tol) w[k]=q.wrong[k]; }
    q.wrong=w;
  }
  return q;
}

/* ── Утилиты (префикс MB_, чтобы не конфликтовать при склейке файлов) ── */
function MB_money(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
/* Красивое число: целое или одна-две цифры после запятой, с запятой как разделителем. */
function MB_num(x){
  const v = Math.round(x * 100) / 100;
  return Number.isInteger(v) ? String(v) : String(v).replace('.', ',');
}
function MB_gcd(a,b){ a=Math.abs(a); b=Math.abs(b); while(b){ [a,b]=[b,a%b]; } return a; }
/* Обыкновенная дробь в виде «3/8» — сокращённая. */
function MB_frac(a,b){ const g=MB_gcd(a,b)||1; return (a/g)+'/'+(b/g); }
function MB_sign(n){ return n<0 ? '− '+Math.abs(n) : '+ '+n; }
/* Отрицательное число для показа: минус-дефис заменяем на настоящий знак минуса. */
function MB_neg(v){ return String(v).replace('-', '−'); }
/* Линейный член со знаком: 1 и −1 печатаются как «x» и «− x», а не «1x». */
function MB_x(k){ const a=Math.abs(k); return (k<0?'− ':'+ ') + (a===1?'':a) + 'x'; }

{id:'MA119', node:'ALG.EQ.02', diff:3, topic:'Число корней по дискриминанту',
 gen(R){ const a=1, variant=R.pick(['two','one','none']);
  /* при варианте «один корень» нужен чётный b, иначе свободный член выходит дробным */
  const b = variant==='one' ? R.pick([-8,-6,-4,-2,2,4,6,8]) : R.int(-9,9);
  let c;
  if(variant==='two'){ c = Math.floor((b*b)/4) - R.int(1,6); }
  else if(variant==='one'){ c = (b*b)/4; }

  ansIdx = D>0 ? 0 : (D===0 ? 1 : 2);
  return {type:'choice', opts, ans:ansIdx,
   codes:opts.map((o,i)=>i===ansIdx?null:'M.INT.02'),
   stem:`Сколько корней имеет уравнение <b>x² ${MB_x(b)} ${MB_sign(c)} = 0</b>?`,

 }},

   в sanitizeQ, но банк обязан быть корректным сам по себе — иначе автотест банка
   и выгрузка на вычитку видят несуществующую ошибку. */
MATH_BANK.forEach(T => {
  const gen = T.gen;
  T.gen = R => {
    const q = gen(R);
    if (q && q.type === 'num' && q.wrong) {
      const tol = q.tol || 0.001, clean = {};
      for (const k in q.wrong) {
        const v = parseFloat(k);
        if (isFinite(v) && Math.abs(v - q.ans) > tol) clean[k] = q.wrong[k];
      }
      q.wrong = clean;
    }
    return q;
  };
});

/* Та же страховка, что в bank-math.js, но для шагов: если при каких-то параметрах
   «типичная ошибка» шага совпала с его верным ответом, ключ убирается. */
MATH2_BANK.forEach(T => {
  const gen = T.gen;
  T.gen = R => {
    const q = gen(R);
    if (q && Array.isArray(q.steps)) {
      q.steps = q.steps.map(st => {
        if (st.type !== 'num' || !st.wrong) return st;
        const tol = st.tol || 0.001, clean = {};
        for (const k in st.wrong) {
          const v = parseFloat(k);
          if (isFinite(v) && Math.abs(v - st.ans) > tol) clean[k] = st.wrong[k];
        }
        return Object.assign({}, st, { wrong: clean });
      });
    }
    return q;
  };
});

{id:'I05', node:'INF.ALG.02', group:'alg', exam:'5', diff:1, topic:'Исполнитель: линейная программа',
 gen(R){ const a=R.int(2,6), b=R.pick([2,3]), st=R.int(1,8);
  let prog=''; for(let k=0;k<4;k++) prog+=R.pick(['1','2']);
  const run=(x,seq,sw)=>{ for(const ch of seq) x = (ch==='1')!==!!sw ? x+a : x*b; return x; };
  const ans=run(st,prog,false);
  const rev=run(st,prog.split('').reverse().join(''),false);
  const sw=run(st,prog,true);
  const w={};
  if(rev!==ans) w[rev]='M.INF.ALG.10';
  if(sw!==ans) w[sw]='M.INF.ALG.14';
  return {type:'num', ans, tol:0.001,
   stem:`У исполнителя «Шаг» две команды: <b>1</b> — прибавь ${a}, <b>2</b> — умножь на ${b}. Исполнитель получил число <b>${st}</b> и выполнил программу <b>${prog}</b>. Какое число получилось?`,
   hint:'Целое число.', wrong:w,
   hints:['Команды выполняются слева направо, по одной.','Выпишите промежуточный результат после каждой команды в столбик.',`Первая команда программы — ${prog[0]}, применяйте её к числу ${st}.`]};
 }},

{id:'I04', node:'INF.MOD.06', group:'dat', exam:'4', diff:2, topic:'Кратчайший путь по таблице расстояний',
 gen(R){ const P=R.shuffle(['А','Б','В','Г','Д','Е']).slice(0,4);
  let p,q,r,s,t,ways,ans,mx,all,guard=0;
  do{ p=R.int(2,9); q=R.int(2,9); r=R.int(2,9); s=R.int(2,9); t=R.int(1,6);

  return {type:'num', ans, tol:0.001,
   stem:`Между четырьмя пунктами ${P.slice().sort().join(', ')} проложены дороги. Их длины в километрах: <b>${P[0]}—${P[1]}: ${p}</b>; <b>${P[0]}—${P[2]}: ${q}</b>; <b>${P[1]}—${P[2]}: ${t}</b>; <b>${P[1]}—${P[3]}: ${r}</b>; <b>${P[2]}—${P[3]}: ${s}</b>. Других дорог нет, по каждой дороге можно ехать в обе стороны. Найдите длину кратчайшего пути из пункта <b>${P[0]}</b> в пункт <b>${P[3]}</b>.`,
   hint:'Целое число километров.', wrong:w,
   hints:['Выпишите все маршруты, ведущие из первого пункта в последний.','Маршрутов ровно четыре: два коротких и два с заездом через третий пункт.','Сложите длины дорог в каждом маршруте и выберите наименьшую сумму.']};
 }},

{id:'I11', node:'INF.DAT.16', group:'dat', exam:'11', diff:2, topic:'Поиск строки по двум условиям',

{id:'I12', node:'INF.DAT.15', group:'dat', exam:'12', diff:3, topic:'Маска имени файла',
 gen(R){ const base=['proba','krug','ramka','tabl','otchet','shema','plan','zadacha','risunok','kod'];

    const re=INF_MASK(m); hit=names.map(x=>re.test(x)); c=hit.filter(Boolean).length;
    if(c>=1&&c<=4) break;
  }
  if(c===0) names[0]=m.replace(/\*/g,'x').replace(/\?/g,'a');
  if(c===5) names[0]='temp.zip';
  const re2=INF_MASK(m); hit=names.map(x=>re2.test(x));
  return {type:'multi', opts:names.slice(), ans:names.map((x,i)=>hit[i]?i:-1).filter(i=>i>=0),

{id:'B501', node:'INF.ALG.05', diff:2, topic:'Исполнитель с тремя командами',
 gen(R){ const a=R.int(1,5), b=R.int(2,4), c=R.int(1,9), st=R.int(2,12);
  let prog=''; for(let k=0;k<5;k++) prog+=R.pick(['1','2','3']);

  return {type:'num', ans, tol:0.001,
   stem:`У исполнителя «Счёт» три команды: <b>1</b> — прибавь ${a}, <b>2</b> — умножь на ${b}, <b>3</b> — вычти ${c}. Исполнитель получил число <b>${st}</b> и выполнил программу <b>${prog}</b>. Какое число получилось?`,
   hint:'Целое число, может быть отрицательным.', wrong:w,

 }},

     RUS.SIN.01 — типы подчинительной связи: отдельное задание 9, чистый алгоритм;
     RUS.PUN.05 — обособление определений (причастный оборот): самая частотная пунктограмма части 1;
     RUS.PUN.12 — вводные слова: вторая по частотности, держится на закрытом списке и на различении
                  вводного слова и члена предложения;
     RUS.ORF.21 — Н/НН: самая частотная орфограмма орфографического анализа;
     RUS.ORF.31 — НЕ с причастиями: даёт и балл в части 1, и типовую ошибку в ГК1.
   Лексика (12) и работа с текстом (10–11) остаются в диагностике: они опираются на словник и на
   исходный текст, тренажёрный цикл «правило → шаг → проверка» для них не работает.
*/

/* ─── служебные сборщики вариантов ────────────────────────────────────────
   RUS_ch  — собирает choice: верный вариант всегда перемешивается с дистракторами,
             поэтому позиция правильного ответа не закреплена.
   RUS_mu  — то же для multi.
   RUS_ls  — нумерованный список для заданий «укажите номера…»: и сам список, и ответ
             строятся после перемешивания, поэтому условие каждый раз новое.            */

function RUS_ch(R, ok, wrongs){
  const arr = R.shuffle([{t:ok, c:null, k:1}].concat(wrongs.map(w=>({t:w[0], c:w[1], k:0}))));
  return {opts:arr.map(x=>x.t), ans:arr.findIndex(x=>x.k===1), codes:arr.map(x=>x.k?null:x.c)};
}

function RUS_mu(R, items){
  const arr = R.shuffle(items);
  return {opts:arr.map(x=>x.t), ans:arr.map((x,i)=>x.ok?i:-1).filter(i=>i>=0),
          codes:arr.map(x=>x.ok?null:(x.c||null))};
}

function RUS_ls(R, items){
  const arr = R.shuffle(items);
  const html = arr.map((x,i)=>`${i+1}) ${x.t}`).join('<br>');
  const yes = arr.map((x,i)=>x.ok?String(i+1):null).filter(Boolean);
  const no  = arr.map((x,i)=>x.ok?null:String(i+1)).filter(Boolean);
  return {html, ans:yes.join(', '),
          alt:[yes.join(''), yes.join(','), yes.join(' '), yes.slice().reverse().join(', '), yes.slice().reverse().join('')],
          all:arr.map((x,i)=>String(i+1)).join(', '), none:no.join(', '), n:arr.length};
}

'M.RUS.SIN.06':{t:'Основы посчитаны по числу глаголов',w:'Инфинитив при вспомогательном глаголе входит в то же сказуемое и новой основы не образует.',d:'Считайте подлежащие, а к каждому находите сказуемое целиком.'},
'M.RUS.SIN.08':{t:'В основу не вошло подлежащее',w:'Если подлежащее в предложении есть, основа состоит из двух главных членов.',d:'Проверьте, есть ли слово в именительном падеже, к которому относится сказуемое.'},
'M.RUS.SIN.09':{t:'В основу включён второстепенный член',w:'Дополнения, определения и обстоятельства в грамматическую основу не входят, как бы близко к глаголу они ни стояли.',d:'Оставьте только то, без чего предложение перестаёт быть предложением.'},
'M.RUS.SIN.10':{t:'Второстепенный член принят за подлежащее',w:'Слова в дательном и творительном падеже подлежащими не бывают: «мне не спалось» — «мне» дополнение.',d:'Проверьте падеж вопросом: подлежащее отвечает только на «кто?» или «что?».'},
'M.RUS.SIN.11':{t:'Частица НЕ отделена от сказуемого',w:'Отрицательная частица входит в состав сказуемого и меняет смысл предложения на противоположный.',d:'Выписывайте сказуемое вместе с НЕ.'},
'M.RUS.SIN.12':{t:'Предложение со сказуемым названо назывным',w:'В назывном предложении единственный главный член — подлежащее; сказуемого в нём нет вообще.',d:'Найдите глагол или его форму: если сказуемое есть, предложение не назывное.'},
'M.RUS.SIN.13':{t:'Предложение с восстановимым подлежащим названо безличным',w:'В безличном предложении подлежащего не может быть в принципе; если деятеля можно подставить, предложение другое.',d:'Попробуйте подставить «я», «мы», «они»: если получается — предложение не безличное.'},
'M.RUS.SIN.14':{t:'Определённо-личное определено без проверки формы глагола',w:'Определённо-личным предложение делает форма 1-го или 2-го лица, по которой деятель восстанавливается однозначно.',d:'Поставьте вопрос к глаголу и назовите его лицо и число.'},
'M.RUS.SIN.15':{t:'Неопределённо-личное определено без проверки формы глагола',w:'Неопределённо-личное предложение опирается на форму 3-го лица множественного числа или прошедшего времени множественного числа.',d:'Проверьте форму глагола: важно не «неизвестно кто», а именно форма.'},
'M.RUS.SIN.16':{t:'Составное глагольное и составное именное смешаны',w:'В составном глагольном вторая часть — инфинитив, в составном именном — имя: прилагательное, существительное, причастие.',d:'Посмотрите, чем выражена вторая часть сказуемого, и назовите часть речи.'},
'M.RUS.SIN.17':{t:'Изменяемое зависимое слово принято за примыкание',w:'При примыкании зависимое слово неизменяемо: наречие, деепричастие или инфинитив.',d:'Измените главное слово по падежам: если зависимое меняется вслед за ним, это не примыкание.'},
'M.RUS.SIN.18':{t:'Связь названа согласованием без проверки согласования',w:'Согласование требует совпадения рода, числа и падежа главного и зависимого слов.',d:'Поставьте главное слово в другой падеж: при согласовании зависимое изменится вместе с ним.'},
'M.RUS.SIN.19':{t:'Связь названа управлением без проверки падежа',w:'При управлении главное слово требует от зависимого строго определённого падежа, который не меняется вслед за главным.',d:'Измените главное слово: если падеж зависимого остался прежним, это управление.'},
'M.RUS.SIN.20':{t:'При замене тип связи не изменился',w:'Заменено слово, но не связь: осталась та же конструкция, а задание требует другую.',d:'Проверьте новое словосочетание по определению нужной связи, прежде чем записывать ответ.'},

'M.RUS.NRM.02':{t:'Числительное или собирательное слово склонено неверно',w:'В составном числительном склоняется каждая часть, а «оба» и «обе» различаются по роду: обеими сторонами, обоими домами.',d:'Проговорите форму целиком и проверьте род существительного, к которому она относится.'},
'M.RUS.NRM.03':{t:'Деепричастие отнесено к другому деятелю',w:'Деепричастие называет добавочное действие того же лица, что и сказуемое. Если подлежащего-деятеля нет, оборот повисает.',d:'Найдите подлежащее и спросите: оно ли выполняет действие деепричастия?'},
'M.RUS.NRM.05':{t:'Две степени сравнения соединены в одну',w:'«Более лучше» и «самый красивейший» соединяют составную и простую формы — норма допускает только одну из них.',d:'Выберите одну форму: либо «более удобный», либо «удобнее».'},
'M.RUS.NRM.06':{t:'Родительный падеж множественного числа образован по слуху',w:'Здесь нет единого правила: носков, помидоров, килограммов, но чулок и мест. Это словарная норма.',d:'Проверяйте такие формы по словарю и запоминайте парами: носки — носков, чулки — чулок.'},
'M.RUS.NRM.07':{t:'Окончание -а поставлено вместо нормативного -ы',w:'Формы «инженера», «договора» в именительном множественного числа за пределами профессиональной речи не нормативны.',d:'Запомните пары нормы: инженеры, договоры, но директора, профессора.'},
'M.RUS.NRM.08':{t:'Форма местоимения взята из разговорной речи',w:'Форм «ихний», «евонный» в литературном языке нет: притяжательность у местоимений 3-го лица выражается формами его, её, их.',d:'Замените на «их» и проверьте, что фраза звучит нейтрально.'},
'M.RUS.NRM.09':{t:'Взята несуществующая форма глагола',w:'У глагола «класть» нет формы «ложит», у «ехать» — формы «ехай»: это разные слова и особые повелительные формы.',d:'Запомните пары: класть — кладёт, положить — положит; ехать — поезжай.'},

'M.RUS.LEX.03':{t:'Фразеологизмом названо любое устойчивое сочетание',w:'Термин и составное наименование тоже устойчивы, но у фразеологизма значение образное и не выводится из слов.',d:'Проверьте, можно ли заменить сочетание одним словом с тем же образным смыслом.'},
'M.RUS.LEX.06':{t:'Разговорным названо нейтральное слово',w:'Нейтральное слово одинаково уместно и в беседе, и в докладе. Разговорное в докладе выглядит чужеродно.',d:'Мысленно поставьте слово в официальное сообщение: если режет слух — оно разговорное.'},
'M.RUS.LEX.07':{t:'Значение фразеологизма выведено из отдельных слов',w:'Смысл фразеологизма целостен: «спустя рукава» не про рукава, а про небрежность.',d:'Подставьте кандидата в живую фразу и проверьте, сохранился ли смысл целиком.'},
'M.RUS.LEX.09':{t:'Фразеологизмом названо свободное сочетание слов',w:'В свободном сочетании каждое слово сохраняет своё прямое значение и его можно заменить другим: «вернулся поздно вечером».',d:'Проверьте, есть ли образный, переносный смысл у сочетания в целом.'},
'M.RUS.LEX.08':{t:'Выбран антоним',w:'Слово противоположно по смыслу тому, что означает фразеологизм: направление значения потеряно.',d:'Сформулируйте значение фразеологизма своими словами, а потом ищите замену.'},

'M.RUS.TXT.07':{t:'Средством связи назван только союз',w:'Предложения связывают также местоимения, повторы, синонимы, наречия и вводные слова.',d:'Найдите во втором предложении слово, отсылающее к первому, и определите его тип.'},
'M.RUS.TXT.08':{t:'Разряд местоимения не проверен',w:'Личные местоимения — он, она, они, его, их; указательные — этот, тот, такой. Это разные средства связи.',d:'Назовите разряд местоимения до того, как выбирать ответ.'},
'M.RUS.TXT.09':{t:'Повтор и синоним смешаны',w:'Лексический повтор — то же самое слово, синоним — другое слово с близким значением.',d:'Сравните слова буквально: совпадают — повтор, различаются — синоним.'},
'M.RUS.TXT.10':{t:'Метафорой названо олицетворение или эпитет',w:'Метафора — перенос названия по сходству. Если неживое действует как живое, это олицетворение; если перед вами образное определение — эпитет.',d:'Определите, что именно перенесено: название предмета, действие живого существа или признак.'},
'M.RUS.TXT.11':{t:'Олицетворением названо выражение без действия живого существа',w:'Олицетворение требует именно действия или состояния, свойственного живому: шепчет, стучится, улыбается.',d:'Найдите глагол: если действия живого существа нет, это не олицетворение.'}

/* ── Утилиты банка ────────────────────────────────────────────────────── */
const H_ROM=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII',
             'XIV','XV','XVI','XVII','XVIII','XIX','XX','XXI'];
const H_c   = y => Math.ceil(y/100);
const H_rom = n => H_ROM[n] || String(n);
/* n различных элементов массива, различающихся по ключу key */
const H_uniq = (R,arr,n,key) => {
  const s=R.shuffle(arr), out=[], used=new Set();
  for(const x of s){ const k=key?key(x):x; if(used.has(k)) continue; used.add(k); out.push(x);
    if(out.length===n) break; }
  return out;
};
/* сборка choice: items = [{t,c}], у верного c отсутствует; позиция всегда случайна */
const H_mc = (R,items) => { const s=R.shuffle(items);
  return {opts:s.map(o=>o.t), ans:s.findIndex(o=>!o.c), codes:s.map(o=>o.c||null)}; };
/* сборка multi: items = [{t,ok}] */
const H_ms = (R,items) => { const s=R.shuffle(items);
  return {opts:s.map(o=>o.t), ans:s.map((o,i)=>o.ok?i:-1).filter(i=>i>=0)}; };
/* нумерованный список внутри условия */
const H_list = a => a.map((x,i)=>`${i+1}) ${x}`).join('<br>');
const H_NUMS = ['1','2','3','4'];
const H_cap = s => s.charAt(0).toUpperCase()+s.slice(1);
/* коды для классически путаемых пар терминов */
const H_CFC = {
 'уроки':'M.HIS.TER.11','погосты':'M.HIS.TER.11','вотчина':'M.HIS.TER.14','поместье':'M.HIS.TER.14',
 'опричнина':'M.HIS.TER.02','земщина':'M.HIS.TER.02','заповедные лета':'M.HIS.TER.16',
 'урочные лета':'M.HIS.TER.16','Земский собор':'M.HIS.TER.07','земство':'M.HIS.TER.07',
 'Синод':'M.HIS.TER.08','Сенат':'M.HIS.TER.08','коллегии':'M.HIS.TER.10','министерства':'M.HIS.TER.10',
 'отруб':'M.HIS.TER.05','хутор':'M.HIS.TER.05','Государственная дума':'M.HIS.TER.09',
 'Государственный совет':'M.HIS.TER.09'};
const H_cfc = t => H_CFC[t] || 'M.HIS.TER.17';
/* классические смешения персоналий (§5.2 атласа) */
const H_PP = {
 'Иван III|Иван IV Грозный':'M.HIS.PER.01', 'Александр II|Александр III':'M.HIS.PER.02',
 'Александр I|Александр II':'M.HIS.PER.02', 'Александр I|Александр III':'M.HIS.PER.02',
 'Николай I|Николай II':'M.HIS.PER.04', 'С. Ю. Витте|П. А. Столыпин':'M.HIS.PER.05',
 'князь Олег|княгиня Ольга':'M.HIS.PER.06', 'Александр Невский|Дмитрий Донской':'M.HIS.PER.07'};
const H_pc = (a,b) => H_PP[a+'|'+b] || H_PP[b+'|'+a] || 'M.HIS.PER.14';
/* пересекаются ли две формулировки по существу (чтобы дистрактор не повторял сам вопрос) */
const H_ov = (a,b) => { const x=a.toLowerCase(), y=b.toLowerCase();
  return x===y || x.indexOf(y.slice(0,18))>=0 || y.indexOf(x.slice(0,18))>=0; };
/* соседний по времени государь — правдоподобный неверный вариант */
const H_near = (R,r) => { const i=H_RUL.indexOf(r);
  const c=H_RUL.filter((x,j)=>x.n!==r.n && Math.abs(j-i)<=3);
  return R.pick(c.length?c:H_RUL.filter(x=>x.n!==r.n)); };
/* событие ↔ единственный правитель, в чьё правление оно произошло */
const H_SKIP_RUL = [1598,1605,1613,1682,1762];
const H_EVRUL = (function(){
  const out=[];
  for(const e of H_EV){
    if(H_SKIP_RUL.indexOf(e.y)>=0) continue;
    const rs=H_RUL.filter(r=>e.y>=r.a && e.y<=r.b);
    if(rs.length!==1) continue;
    const key=rs[0].n.split(' ')[0].slice(0,5);
    if(e.t.indexOf(key)>=0) continue;
    out.push({e:e, r:rs[0]});
  }
  return out;
})();

// ── HIS.SRC.12 · Поиск фактических ошибок и анахронизмов ───────────────
{id:'HB501', node:'HIS.SRC.12', diff:3, topic:'Неверно назван государь',
 gen(R){ const t=R.pick(H_EVRUL), bad=H_near(R,t.r);
  const rest=H_uniq(R,H_RUL.filter(r=>r.n!==t.r.n&&r.n!==bad.n),2,x=>x.n);
  const others=[bad].concat(rest);
  const m=H_mc(R,[{t:t.r.n}].concat(others.map(x=>({t:x.n, c:H_pc(t.r.n,x.n)}))));
  return {type:'choice', opts:m.opts, ans:m.ans, codes:m.codes,
   stem:`В тексте написано: «В ${t.e.y} году, в правление <b>${bad.g}</b>, произошло следующее: ${t.e.t}». Государь назван неверно. Кто правил на самом деле?`,
   hints:['Год в предложении указан верно — неверно только имя.',
          `Вспомните, чьи годы правления включают ${t.e.y} год.`]};
 }},

{id:'HB502', node:'HIS.SRC.12', diff:3, topic:'Ошибочная строка в перечне',
 gen(R){ const s=H_uniq(R,H_EV,4,x=>x.y), bad=s[0];
  let alt=R.pick(H_EV), g=0;
  while((alt.y===bad.y||Math.abs(alt.y-bad.y)>120) && g++<40) alt=R.pick(H_EV);
  const wrongY = alt.y===bad.y ? bad.y+13 : alt.y;
  const rows=s.map(x=>({x:x, y:(x===bad?wrongY:x.y), ok:x!==bad}));
  const list=R.shuffle(rows), ans=list.findIndex(r=>!r.ok);
  return {type:'choice', opts:H_NUMS, ans:ans,
   codes:H_NUMS.map((_,i)=>i===ans?null:'M.HIS.SRC.06'),
   stem:`В перечне одна строка содержит фактическую ошибку:<br>${H_list(list.map(r=>`${r.y} г. — ${r.x.t}`))}<br>Укажите номер ошибочной строки.`,
   hints:['Ошибку нужно искать в датах и именах, а не в стиле фразы.',
          'Проверьте каждую строку по своей ленте времени, начиная с самых знакомых дат.']};
 }},

{id:'HB503', node:'HIS.SRC.12', diff:4, topic:'Все ошибочные строки',
 gen(R){ const s=H_uniq(R,H_EV,5,x=>x.y), k=R.int(2,3);
  const rows=s.map((x,i)=>{
    if(i<k){ let a=R.pick(H_EV), g=0;
      while(a.y===x.y && g++<30) a=R.pick(H_EV);
      return {t:`${a.y===x.y?x.y+17:a.y} г. — ${x.t}`, ok:true}; }
    return {t:`${x.y} г. — ${x.t}`, ok:false};
  });
  const m=H_ms(R,rows);
  return {type:'multi', opts:m.opts, ans:m.ans,
   stem:`Укажите <b>все</b> строки, в которых год указан <b>неверно</b>.`,
   hints:['Верных строк тоже несколько — не ищите единственную ошибку.',
          'Идите по списку сверху вниз и для каждой строки вспоминайте свой год.']};
 }},

{id:'HB504', node:'HIS.SRC.12', diff:4, topic:'Что именно указано неверно',
 gen(R){ const t=R.pick(H_EVRUL), kind=R.int(0,1);
  let y=t.e.y, who=t.r.g;
  if(kind===0){ const near=H_EV.filter(x=>x.y!==t.e.y && Math.abs(x.y-t.e.y)<=60);
    y = near.length ? R.pick(near).y : t.e.y+R.int(11,40); }
  else { who=H_near(R,t.r).g; }
  const m=H_mc(R,[{t: kind===0?'указанный год':'имя государя'},
                  {t: kind===0?'имя государя':'указанный год', c:'M.HIS.SRC.06'},
                  {t:'название события', c:'M.HIS.SRC.06'}]);
  return {type:'choice', opts:m.opts, ans:m.ans, codes:m.codes,
   stem:`В тексте написано: «В ${y} году, в правление ${who}, произошло следующее: ${t.e.t}». В предложении одна ошибка. Что указано неверно?`,
   hints:['Само событие названо правильно — сомнение вызывают только год и имя.',
          `Проверьте отдельно: в каком году это было и чьи годы правления его включают.`]};
 }},

{id:'HB505', node:'HIS.SRC.12', diff:5, topic:'Анахронизм в тексте',

const S_NDS = 22;                       // ставка НДС, %
const S_NDFL = [                        // шкала НДФЛ: [порог годового дохода, ставка %]
  {from:0,        rate:13},
  {from:2400000,  rate:15},
  {from:5000000,  rate:18},

/* ── Утилиты ──────────────────────────────────────────────────────────── */
function S_money(n){ return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
function S_uniq(R, arr, n, key){
  const seen = new Set(), out = [];
  let guard = 0;
  while (out.length < n && guard++ < 400){
    const x = R.pick(arr), k = key ? key(x) : x;
    if (seen.has(k)) continue;
    seen.add(k); out.push(x);
  }
  return out;
}
function S_list(items){ return items.map((t,i)=>`${i+1}) ${t}`).join('<br>'); }
function S_cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
/* два разных признака одного типа — условие задания собирается комбинаторно */
function S_two(R, item){ const p=R.shuffle(item.s.slice()).slice(0,2); return p[0] + ', ' + p[1]; }
/* НДФЛ по прогрессивной шкале: ставка применяется к превышению над порогом */
function S_ndfl(income){
  let tax = 0;
  for (let i = 0; i < S_NDFL.length; i++){
    const from = S_NDFL[i].from, to = (i+1 < S_NDFL.length) ? S_NDFL[i+1].from : Infinity;
    if (income <= from) break;
    tax += (Math.min(income, to) - from) * S_NDFL[i].rate / 100;
  }
  return Math.round(tax);
}

/* ═══ КОД РЕЗУЛЬТАТА ═══
   Превращает результаты диагностики ПО ВСЕМ пройденным предметам в одну строку,
   которую родитель вставляет в страницу отчёта, чтобы получить сводный разбор.

   Бэкенда нет и не будет: любой сервер означает сбор персональных данных,
   согласия родителей и совсем другой правовой контур. Поэтому результат едет
   к генератору отчёта внутри самого себя.

   Формат:  PRG3.<base64url(JSON)>.<сумма>        — без сжатия
            PRG3Z.<base64url(deflate)>.<сумма>    — со сжатием (обычный случай)

   Пять предметов без сжатия дают ~3 500 символов: такой код неудобно выделить
   и перенести целиком — поэтому сжатие здесь не оптимизация, а требование.
   Где CompressionStream недоступен, отдаём несжатый вариант: он длиннее, но рабочий.

   ЧЕГО В КОДЕ НЕТ И НЕ ДОЛЖНО ПОЯВИТЬСЯ: имени, школы, класса, возраста, города и
   любой строки, которую набрал человек. Числовой ответ проходит rcAnswer() и остаётся
   числом не длиннее RC_ANS_MAX знаков: телефон и номер карты в поле ответа отсекаются
   по длине; ответ-слово и выбранный вариант хранятся НОМЕРОМ — текст отчёт восстановит
   сам из (id, seed). Поэтому по русскому языку и истории в коде тоже нет ни одного слова.

   Полезная нагрузка:
     [3, дата в днях от эпохи, { ключ предмета: [ минут, [баллы], {группы}, [задания], [освоенность] ] } ]
       баллы      [первичный, нижняя граница, верхняя, точность×100, порог взят, верно в группе порога, всего в ней, максимум]
       группы     {ключ: [верно, всего]}
       задания    верное  → [id, 1]
                  неверное→ [id, 0, seed, код ошибки|0, ответ|0, вариант|0]
                  вариант хранится СО СДВИГОМ НА ЕДИНИЦУ (1 = первый вариант),
                  иначе выбор первого варианта не отличить от «не ответил»
                  seed хранится только у неверных: только их отчёт показывает целиком
       освоенность[[узел, ×100], …] — только то, что отличается от значения по умолчанию
*/

const RC_VER = 3;
const RC_MAST_DEFAULT = 0.3;
const RC_QR_MAX = 1200;                    // длиннее — QR с экрана телефона не снимается (R-01 §4.2)

function rcB64(bytes){                     // Uint8Array → base64url без «=»
  let bin=''; for(let i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function rcHash(str){                      // FNV-1a — ловит код, скопированный не целиком
  let h=0x811c9dc5;
  for(let i=0;i<str.length;i++){ h ^= str.charCodeAt(i); h = Math.imul(h,0x01000193)>>>0; }
  return h.toString(36);
}
/* Ответ ученика попадает в код только как число: буквы и любой свободный текст отсекаются.
   Длина ограничена тем, что вообще может быть ответом задания ОГЭ: 10 знаков хватает
   с запасом, а номер телефона (11) и номер карты (16) уже не проходят (аудит R-19, находка 3). */
const RC_ANS_MAX = 10;
function rcAnswer(v){
  const t = String(v==null?'':v).trim();
  if(!t || t.length>RC_ANS_MAX) return 0;
  return /^[-−]?[0-9]+([.,\/][0-9]+)?$/.test(t) ? t.replace('−','-') : 0;
}
/* Номер варианта — со сдвигом на 1: ноль занят под «варианта нет».
   Для заданий с несколькими ответами приезжает массив номеров. */
function rcPick(p){
  if(p==null) return 0;
  if(Array.isArray(p)) return p.length ? p.map(i=>i+1) : 0;
  return (typeof p === 'number' && p >= 0) ? p+1 : 0;
}
function rcItem(x){
  if(x.ok) return [x.id, 1];
  return [x.id, 0, x.seed>>>0, x.code || 0, rcAnswer(x.given), rcPick(x.pick)];
}
function rcSubject(key){
  const r = ST.d[key]; if(!r) return null;
  const s = SUBJECTS[key]; if(!s) return null;
  const mast = ST.m[key] || {};
  const groups = {};
  for(const g in r.groups) groups[g] = [r.groups[g].ok, r.groups[g].n];
  return [
    r.mins || 1,
    [r.primary, r.lo, r.hi, Math.round(r.acc*100), r.thr?1:0, r.gateOk, r.gateN, s.maxPrimary],
    groups,
    r.items.map(rcItem),
    Object.keys(mast).filter(k => mast[k] !== RC_MAST_DEFAULT).sort()
           .map(k => [k, Math.round(mast[k]*100)])
  ];
}
/* Предметы, по которым диагностика пройдена — в порядке реестра, а не в порядке прохождения. */
function porogDoneSubjects(){
  return Object.keys(SUBJECTS).filter(k => ST.d[k]);
}
/* Готовая строка результата. Промис: сжатие в браузере асинхронное.
   null, если не пройдено ни одной диагностики. */
async function porogCode(){
  const keys = porogDoneSubjects();
  if(!keys.length) return null;
  const payload = {};
  for(const k of keys) payload[k] = rcSubject(k);
  const json = JSON.stringify([RC_VER, Math.floor(Date.now()/86400000), payload]);
  const raw = new TextEncoder().encode(json);
  let body, tag = 'PRG3';
  try{
    if(typeof CompressionStream === 'function'){
      const cs = new CompressionStream('deflate-raw');
      const packed = new Response(new Blob([raw]).stream().pipeThrough(cs));
      body = new Uint8Array(await packed.arrayBuffer());
      tag = 'PRG3Z';
    } else body = raw;
  }catch(e){ body = raw; tag = 'PRG3'; }
  const b = rcB64(body);
  return tag+'.'+b+'.'+rcHash(b);
}
/* Заполняет блок кода на экране: до этого там кнопка, а не простыня из символов. */
async function porogFillCode(){
  const box = document.getElementById('rc-box'); if(!box) return;
  box.textContent = 'собираю…';
  const code = await porogCode();
  if(!code){ box.textContent = 'Сначала пройдите хотя бы одну диагностику.'; return; }
  box.textContent = code;
  box.classList.add('ready');
  const btn = document.getElementById('rc-make'); if(btn) btn.remove();
  const copy = document.getElementById('rc-copy'); if(copy) copy.hidden = false;
  const where = document.getElementById('rc-where'); if(where) where.hidden = false;
  if(CFG.reportUrl) porogFillLink(code);
}
/* Ссылка на страницу отчёта: код едет во фрагменте и потому не уходит на сервер
   ни в запросе, ни в Referer, ни в журнале доступа (R-01 §1.4).
   Схему проверяем до склейки: адрес задаём мы в исходнике, но опечатка или
   `javascript:` в конфиге не должны доехать до href ссылки (аудит R-19, находка 2). */
const RC_URL_OK = /^https:\/\/\S/;
function porogReportLink(code){
  const base = String(CFG.reportUrl || '').split('#')[0];
  return RC_URL_OK.test(base) ? base + '#' + code : '';
}
/* Ссылка, «Поделиться», «Открыть страницу отчёта» и QR — только когда адрес задан.
   Все эти элементы приходят одной веткой разметки: нет rc-link — нет и остальных. */
function porogFillLink(code){
  const box = document.getElementById('rc-link');
  if(!box) return;
  const link = porogReportLink(code);
  box.textContent = link; box.hidden = false;
  const goto_ = document.getElementById('rc-goto');
  goto_.href = link; goto_.hidden = false;
  document.getElementById('rc-copy-link').hidden = false;
  if(typeof navigator.share === 'function') document.getElementById('rc-share').hidden = false;
  if(link.length <= RC_QR_MAX){
    const qr = document.getElementById('rc-qr');
    qr.innerHTML = porogQrPlace(link); qr.hidden = false;
  }
}
/* ЗАГЛУШКА, а не QR. Настоящего энкодера в проекте нет: demo/src/qr-code.js — один
   статический SVG на фиксированный адрес демо, произвольную ссылку им не закодировать.
   Рисовать QR с чужим содержимым нельзя, а нечитаемый QR хуже отсутствующего
   (R-01 §3.1), поэтому здесь честное место под него — как в макете R-02 (Д-4). */
function porogQrPlace(link){
  return `<div class="rc-qr-box">QR</div>
    <p>Здесь появится QR на эту ссылку: ${link.length} ${porogPlural(link.length,'символ','символа','символов')} при пороге ${RC_QR_MAX}.
    Пока передайте ссылку кнопкой «Поделиться» или скопируйте её.</p>`;
}
/* Копирование: штатный API, при отказе — запасной путь для старых браузеров.
   Демо открывают и с file://, где isSecureContext ложно, — там сразу запасной путь. */
function porogCopyText(txt, msg){
  const done = ()=> flash(msg);
  function fallback(){
    const ta=document.createElement('textarea'); ta.value=txt;
    ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); done(); }catch(e){ flash('Выделите текст и скопируйте вручную'); }
    ta.remove();
  }
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, fallback);
  else fallback();
}
function porogCopyCode(){
  const el = document.getElementById('rc-box'); if(!el) return;
  const txt = el.textContent.trim();
  if(!txt || !/^PRG/.test(txt)) return flash('Сначала соберите код');
  porogCopyText(txt, 'Код скопирован целиком');
}
function porogCopyLink(){
  const el = document.getElementById('rc-link'); if(!el) return;
  const txt = el.textContent.trim();
  if(!txt) return flash('Сначала соберите код');
  porogCopyText(txt, 'Ссылка скопирована целиком');
}
/* Системное «Поделиться»: приложение выбирает человек, и нам оно не возвращается —
   узнать, куда ушла ссылка, мы не можем по построению (R-01 крит. 37).
   Закрытое окно обмена — не ошибка, на неё не ругаемся. */
function porogShareLink(){
  const el = document.getElementById('rc-link'); if(!el) return;
  const url = el.textContent.trim();
  if(!url) return flash('Сначала соберите код');
  if(typeof navigator.share !== 'function') return porogCopyLink();
  navigator.share({title:'Результат диагностики', url}).catch(e => {
    if(!e || e.name !== 'AbortError') flash('Поделиться не вышло — скопируйте ссылку кнопкой рядом');
  });
}
/* Блок «Отчёт для родителей». Один и тот же на главной и на экране результата.
   Видимость блока зависит ТОЛЬКО от того, пройдена ли хоть одна диагностика.
   Адрес страницы приёма кода (CFG.reportUrl) на видимость не влияет: пустой адрес
   означает передачу кода через буфер обмена, а не спрятанную кнопку (R-01 §1.6). */
function porogReportBlock(){
  const keys = porogDoneSubjects();
  if(!keys.length) return '';
  const names = keys.map(k => SUBJECTS[k].name).join(', ');
  const rest = Object.keys(SUBJECTS).length - keys.length;
  /* Ссылочная ветка включается, только если адрес годен: пустой или не-https
     конфиг оставляет блок на буфере обмена, а не рисует мёртвую ссылку. */
  const url = !!porogReportLink('');
  return `
  <div class="rc">
    <h3>Отчёт для родителей</h3>
    <p>Соберите код результата и ${url ? 'отправьте родителям ссылку' : 'передайте его родителям'}. По коду собирается разбор:
    что уже освоено, какие пробелы стоят больше всего баллов на экзамене и что делать в ближайшие недели.</p>
    <p class="rc-subj">В отчёт войдёт: <b>${names}</b>.${rest ? ` Ещё ${rest} ${porogPlural(rest,'предмет','предмета','предметов')} можно пройти и добавить в тот же отчёт.` : ''}</p>
    <div class="rc-code" id="rc-box">код собирается по кнопке ниже</div>
    ${url ? '<div class="rc-code rc-link" id="rc-link" hidden></div>' : ''}
    <div class="row">
      <button id="rc-make" onclick="porogFillCode()">Собрать код</button>
      ${url ? `<button id="rc-share" hidden onclick="porogShareLink()">Поделиться</button>
      <button id="rc-copy-link" hidden onclick="porogCopyLink()">Скопировать ссылку</button>
      <a id="rc-goto" class="rc-goto" hidden target="_blank" rel="noopener" href="">Открыть страницу отчёта</a>` : ''}
      <button id="rc-copy" ${url ? 'class="ghost" ' : ''}hidden onclick="porogCopyCode()">Скопировать код</button>
    </div>
    ${url ? '<div class="rc-qr" id="rc-qr" hidden></div>' : ''}
    <p class="rc-where" id="rc-where" hidden>${url
      ? 'Отправьте родителям ссылку — она откроет отчёт по этому коду. «Скопировать код» — запасной путь, если ссылка дошла обрезанной.'
      : 'Скопируйте код целиком и передайте родителям — по нему собирается отчёт. Тот же код принимает сводка по классу у учителя.'}</p>

/* ═══ СВОДКА ПО КЛАССУ ═══
   Учитель проводит срез на уроке, ученики называют коды результата — учитель вставляет их
   на этой странице и получает агрегат: что просело у класса, что повторить, какие ошибки
   типовые. Решение D36: сводка превращает участие учителя из одолжения в его интерес.

   ПРИВАТНОСТЬ (D30). Коды разбираются в браузере учителя. Ничего не отправляется на сервер
   (его нет) и ничего не сохраняется между открытиями страницы. В самих кодах нет ни имён,
   ни школы, ни класса — только идентификаторы заданий, seed и номера ответов. */

const CL = { codes:'', rows:[], errs:[], done:false };

/* ── Разбор кода: обратная операция к porogCode() ─────────────────────── */
function clFromB64(b64){
  const s = b64.replace(/-/g,'+').replace(/_/g,'/');
  const bin = atob(s + '==='.slice((s.length + 3) % 4));
  const out = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function clDecode(code){
  const t = String(code).trim();
  const parts = t.split('.');
  if(parts.length !== 3) throw new Error('это не код результата: в нём должно быть две точки');
  const [tag, body, hash] = parts;
  if(tag !== 'PRG3' && tag !== 'PRG3Z') throw new Error('код другой версии — ждём PRG3 или PRG3Z');
  if(rcHash(body) !== hash) throw new Error('код скопирован не целиком: контрольная сумма не сходится');
  let bytes = clFromB64(body);
  if(tag === 'PRG3Z'){
    if(typeof DecompressionStream !== 'function')
      throw new Error('браузер не умеет разжимать код — откройте страницу в свежем Chrome, Safari или Firefox');
    const ds = new DecompressionStream('deflate-raw');
    const r = new Response(new Blob([bytes]).stream().pipeThrough(ds));
    bytes = new Uint8Array(await r.arrayBuffer());
  }
  const data = JSON.parse(new TextDecoder().decode(bytes));
  if(!Array.isArray(data) || data[0] !== RC_VER) throw new Error('код собран другой версией демо');
  return data[2] || {};
}

/* ── Сбор сводки ──────────────────────────────────────────────────────── */
async function clBuild(){
  const box = document.getElementById('cl-in');
  CL.codes = box ? box.value : '';
  CL.errs = [];
  /* Учитель вставляет коды как получится: по строкам, через запятую, с лишними пробелами.
     Всё, что похоже на код (начинается с PRG), идёт в разбор; остальные непустые строки —
     в список нераспознанного, чтобы ничей результат не потерялся молча. */
  const list = [];
  for(const raw of CL.codes.split(/[\s,;]+/)){
    const t = raw.trim();
    if(!t) continue;
    if(/^PRG/i.test(t)) list.push(t);
    else CL.errs.push(`«${t.slice(0,24)}${t.length>24?'…':''}» — это не код результата`);
  }
  CL.rows = []; CL.done = true;
  let n = 0;
  for(const c of list){
    n++;
    try { CL.rows.push(await clDecode(c)); }
    catch(e){ CL.errs.push(`код № ${n}: ${e.message}`); }
  }
  render();
}
function clClear(){ CL.codes=''; CL.rows=[]; CL.errs=[]; CL.done=false; render(); }

/* Номера заданий ОГЭ по разделу: «1–5, 6» + «6, 8» → «1–6, 8», без повторов. */
function clExam(list){
  const nums = new Set();
  for(const raw of list){
    for(const chunk of String(raw||'').split(',')){
      const c = chunk.trim();
      const m = c.match(/^(\d+)\s*[–—-]\s*(\d+)$/);
      if(m){ for(let i=+m[1]; i<=+m[2]; i++) nums.add(i); }
      else if(/^\d+$/.test(c)) nums.add(+c);
    }
  }
  const a = [...nums].sort((x,y)=>x-y), out = [];
  for(let i=0;i<a.length;i++){
    let j=i; while(j+1<a.length && a[j+1]===a[j]+1) j++;
    out.push(j-i>=1 ? a[i]+'–'+a[j] : String(a[i]));
    i=j;
  }
  return out.join(', ');
}

/* Задание по id — чтобы показать тему и номер задания ОГЭ. */
function clTask(key, id){
  const s = SUBJECTS[key]; if(!s) return null;
  return (s.diag || []).find(t=>t.id===id) || (s.bank || []).find(t=>t.id===id) || null;
}
/* Агрегат по одному предмету: группы, ошибки, баллы. */
function clAgg(key){
  const rows = CL.rows.filter(r=>r[key]).map(r=>r[key]);
  if(!rows.length) return null;
  const s = SUBJECTS[key];
  /* Ключи приезжают из чужого кода, поэтому карты — без прототипа: иначе ключ
     вида `__proto__` пишет счётчики в Object.prototype (R-20). */
  const groups = Object.create(null), errors = Object.create(null), tasks = Object.create(null);
  const names = s.groupNames || {};
  let lo=0, hi=0, acc=0, mins=0;
  for(let pi=0; pi<rows.length; pi++){
    const r = rows[pi];
    const sc = r[1] || [];
    lo += +sc[1]||0; hi += +sc[2]||0; acc += +sc[3]||0; mins += +r[0]||0;
    for(const g in (r[2]||{})){
      /* Название раздела берём только из своего справочника: неизвестный ключ
         на экран не попадает вовсе, а не печатается как есть (R-20). */
      const v = r[2][g];
      if(!Object.hasOwn(names, g) || !Array.isArray(v)) continue;
      const ok = +v[0]||0, tot = +v[1]||0;
      groups[g] = groups[g] || {ok:0, n:0, weak:0, pupils:0};
      groups[g].ok += ok; groups[g].n += tot; groups[g].pupils++;
      if(tot && ok / tot < 0.5) groups[g].weak++;
    }
    for(const raw of (Array.isArray(r[3]) ? r[3] : [])){
      const it = raw || [], id = String(it[0] ?? ''), ok = it[1] === 1;
      if(!id) continue;
      tasks[id] = tasks[id] || {n:0, bad:0};
      tasks[id].n++; if(!ok) tasks[id].bad++;
      /* Считаем учеников, а не срабатывания: один и тот же код у одного ученика — один голос. */
      if(!ok && it[3]){ (errors[String(it[3])] = errors[String(it[3])] || new Set()).add(pi); }
    }
  }
  const k = rows.length;
  return {
    key, name:s.name, pupils:k, maxPrimary:s.maxPrimary,
    lo: Math.round(lo/k), hi: Math.round(hi/k), acc: Math.round(acc/k), mins: Math.round(mins/k),
    groups: Object.keys(groups).map(g=>({
      g, title:names[g],
      ok:groups[g].ok, n:groups[g].n,
      pct: groups[g].n ? Math.round(groups[g].ok/groups[g].n*100) : 0,
      weak: groups[g].weak, pupils: groups[g].pupils,
      exam: clExam((s.diag||[]).filter(t=>t.group===g).map(t=>t.exam))
    })).sort((a,b)=>a.pct-b.pct),
    errors: Object.keys(errors).map(c=>({code:c, n:errors[c].size, m:Object.hasOwn(MIS,c)?MIS[c]:null}))
      .sort((a,b)=>b.n-a.n).slice(0, 8),
    tasks: Object.keys(tasks).map(id=>({id, ...tasks[id], t:clTask(key,id)}))
      .filter(x=>x.bad>0).sort((a,b)=>(b.bad/b.n)-(a.bad/a.n) || b.bad-a.bad).slice(0, 6)
  };
}

/* ═══ ГЕНЕРАТОР СЛУЧАЙНЫХ ЧИСЕЛ (детерминированный по seed) ═══ */
function mkR(seed){
  let s=seed>>>0;
  const r=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);
    t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};
  return {r, int:(a,b)=>a+Math.floor(r()*(b-a+1)), pick:a=>a[Math.floor(r()*a.length)],
    shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}};
}
let SEED = (Date.now()^0x9E3779B9)>>>0;
let LAST_SEED = 0;                       // seed последнего выданного задания — нужен, чтобы отчёт мог его воспроизвести
const nextR = ()=>{ SEED = (SEED*1664525+1013904223)>>>0; LAST_SEED = SEED; return mkR(SEED); };

const $ = s => document.querySelector(s);
const num = s => { const t=String(s).trim().replace(/\s| /g,'').replace(',','.').replace(/−/g,'-');
  return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : NaN; };

const LET = 'АБВГДЕЖ';
function sanitizeQ(q){
  if(q.type==='num'&&q.wrong){ const w={},tol=q.tol||0.001;
    for(const k in q.wrong){const v=parseFloat(k); if(isFinite(v)&&Math.abs(v-q.ans)>tol) w[k]=q.wrong[k];}
    q.wrong=w; }
  return q;
}

/* ═══ BKT ═══ */
function bkt(p, correct){
  const SLIP=.1, GUESS=.2, T=.28;
  const post = correct ? p*(1-SLIP)/(p*(1-SLIP)+(1-p)*GUESS)
                       : p*SLIP/(p*SLIP+(1-p)*(1-GUESS));
  return Math.min(.985, post+(1-post)*T);
}

/* ═══ ПРОВЕРКА ОТВЕТА · ЕДИНАЯ ДЛЯ ВСЕХ ТИПОВ ═══ */
function rightText(q){
  if(q.type==='steps'){ const st=curStep(q); return st ? rightText(st) : ''; }
  if(q.type==='num')  return fmt(q.ans);
  if(q.type==='text') return String(q.ans);
  if(q.type==='mc')   { const o=q.opts.find(o=>o.ok); return o?o.t:'—'; }
  if(q.type==='choice') return q.opts[q.ans];
  if(q.type==='multi')  return (q.ans||q.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0)).map(i=>LET[i]).join(', ');
  return '—';
}
/* Возвращает {ok, code, given} либо null, если ответ не введён. */
function grade(q, raw, picked){
  if(q.type==='num'){
    const given = String(raw||'').trim();
    if(!given) return null;
    const v=num(raw);
    if(isNaN(v)) return {ok:false, code:null, given};
    const tol=q.tol||0.001;
    if(Math.abs(v-q.ans)<=tol) return {ok:true, code:null, given};
    for(const k in (q.wrong||{})) if(Math.abs(v-parseFloat(k))<=tol) return {ok:false, code:q.wrong[k], given};
    return {ok:false, code:null, given};
  }
  if(q.type==='text'){
    const given = String(raw||'').trim();
    if(!given) return null;
    const n=norm(given);
    const good=[q.ans].concat(q.alt||[]).map(norm);
    if(good.includes(n)) return {ok:true, code:null, given};
    for(const k in (q.wrong||{})) if(norm(k)===n) return {ok:false, code:q.wrong[k], given};
    return {ok:false, code:null, given};
  }
  if(q.type==='choice'||q.type==='mc'){
    if(picked===null||picked===undefined||Array.isArray(picked)) return null;
    if(q.type==='mc'){ const o=q.opts[picked]; return {ok:!!o.ok, code:o.ok?null:(o.m||null), given:o.t}; }
    const ok = picked===q.ans;
    return {ok, code:ok?null:((q.codes||[])[picked]||null), given:q.opts[picked]};
  }
  if(q.type==='multi'){
    if(!Array.isArray(picked)||!picked.length) return null;
    const chosen=[...picked].sort((a,b)=>a-b);
    const need = (q.ans||q.opts.map((o,i)=>o.ok?i:-1).filter(i=>i>=0)).slice().sort((a,b)=>a-b);
    const ok = chosen.length===need.length && chosen.every((v,i)=>v===need[i]);
    return {ok, code:null, given:chosen.map(i=>LET[i]).join(', ')};
  }
  return null;
}
function optText(o){ return typeof o==='string' ? o : o.t; }
